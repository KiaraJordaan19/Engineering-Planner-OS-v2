<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Compatibility note: the original design embedded Inter/Caveat as base64
     @font-face data (~300KB across three font-weight blocks) purely so the
     page never depended on an external request. That is not the cause of
     the {{...}} bug, but it is extra payload and one more thing that can
     fail silently. Loading the same two font families from Google Fonts'
     CDN instead is a deliberate reliability simplification made during this
     compatibility repair, not a design change: same typefaces, same weights,
     lighter and more robust delivery. If Kiara ever needs a fully offline
     copy again, the base64 blocks from the previous Index.html can be
     pasted back into this <style> block unchanged. */
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#F6E3D1; }
  body { font-family:'Inter',sans-serif; color:#3B332B; -webkit-font-smoothing:antialiased; }
  a { color:inherit; text-decoration:none; }
  input, textarea, select, button { font-family:'Inter',sans-serif; }
  input:focus, textarea:focus, select:focus { outline:2px solid #DD7A56; outline-offset:1px; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:#E7C7A9; border-radius:8px; }
  .ep-fade-in { animation: epFadeIn .18s ease-out; }
  @keyframes epFadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
  .ep-spin { animation: epSpin 0.9s linear infinite; display:inline-block; }
  @keyframes epSpin { to { transform:rotate(360deg); } }
  .ep-clickable:hover { filter:brightness(0.97); }
  .ep-nav-row:hover { background:#F3E3D2; }

  /* ============================================================
     v1.1.12 master -- Feature 9: iPad responsiveness.
     Support targets: 768x1024 portrait, 1024x768 landscape, desktop >1200px.
     Everything in this block lives inside max-width media queries, so the
     desktop layout above 1200px is completely unchanged (same widths, same
     grids, same nav) -- only narrower viewports are affected.
     ============================================================ */
  html, body { overflow-x: hidden; } /* safety net: no page-level horizontal scroll at any width */

  .ep-shell { display:flex; min-height:100vh; background:#F6E3D1; font-family:'Inter',sans-serif; color:#3B332B; }
  .ep-sidebar { width:252px; flex-shrink:0; background:#FBEAD9; border-right:1px solid #EFD3B8; padding:28px 18px; display:flex; flex-direction:column; gap:22px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .ep-content { flex:1; padding:36px 44px 60px; min-width:0; }
  .ep-navtoggle { display:none; }
  .ep-navbackdrop { display:none; }

  /* Calendar's 7-day grid: minmax(0,1fr) lets columns actually shrink below
     their content's natural width instead of forcing horizontal overflow --
     the classic CSS Grid gotcha that a plain repeat(7,1fr) doesn't fully
     solve once cell content (event pills) gets wide. */
  .ep-cal-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:8px; }
  .ep-cal-day { border-radius:12px; padding:8px; min-height:96px; min-width:0; }
  .ep-cal-event { font-size:10.5px; font-weight:600; border-radius:6px; padding:3px 6px; margin-bottom:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .ep-week-grid { display:grid; grid-template-columns:44px repeat(5,1fr); gap:14px; }
  .ep-week-scroll { overflow-x:visible; }
  /* v1.4.0 -- shared time-grid for the Weekly Timetable: every day column is
     the same height (ep-week-track), sessions are positioned absolutely
     within it by real clock time (inline top/height, computed from
     startMin/endMin), and the hour ruler (ep-week-hourcol) shares the exact
     same height/scale so an 08:00 class on one day lines up with an 08:00
     class on another, instead of each day just stacking cards in order. */
  .ep-week-track { position:relative; background-image:repeating-linear-gradient(to bottom, #F0DCC8 0, #F0DCC8 1px, transparent 1px, transparent var(--ep-week-hour-px)); background-position:0 0; }
  .ep-week-hourcol { position:relative; }
  .ep-week-hourlabel { position:absolute; left:0; right:6px; text-align:right; font-size:10.5px; font-weight:700; color:#8A7A68; transform:translateY(-6px); }
  .ep-week-session-abs { position:absolute; left:2px; right:2px; border-radius:8px; padding:5px 8px; overflow:hidden; }

  .ep-table-scroll { overflow-x:visible; }

  /* ---- Tablet landscape (Calendar: all 7 columns visible, narrower sidebar) ---- */
  @media (max-width:1024px) {
    .ep-sidebar { width:190px; padding:20px 12px; }
    .ep-content { padding:24px 22px 44px; }
    .ep-cal-grid { gap:5px; }
    .ep-cal-day { padding:6px; min-height:78px; }
    .ep-cal-event { font-size:10px; padding:2px 5px; }
    .ep-table-scroll { overflow-x:auto; }
    .ep-week-scroll { overflow-x:auto; }
  }

  /* ---- Portrait tablet (768 wide and under, and anything narrower):
     sidebar becomes a collapsible off-canvas drawer instead of squeezing the
     Calendar's 7 columns down further. Nav is never permanently hidden --
     the ☰ Menu button is always reachable and every section stays a tap
     away, it's just not permanently docked at this width. ---- */
  @media (max-width:900px) {
    .ep-sidebar {
      position:fixed; left:0; top:0; height:100vh; width:248px;
      transform:translateX(-100%); transition:transform .2s ease-out;
      z-index:9500; box-shadow:2px 0 24px rgba(59,51,43,0.25);
    }
    .ep-sidebar.ep-open { transform:translateX(0); }
    .ep-navtoggle {
      display:inline-flex; align-items:center; gap:8px; cursor:pointer;
      background:#FDF6F0; border:1px solid #F0DCC8; border-radius:10px;
      padding:9px 14px; font-size:13.5px; font-weight:700; color:#3B332B;
      margin-bottom:18px;
    }
    .ep-navbackdrop {
      display:block; position:fixed; inset:0; background:rgba(59,51,43,0.35); z-index:9400;
    }
    .ep-content { padding:20px 16px 40px; }
    .ep-cal-grid { gap:4px; }
    .ep-cal-day { padding:5px; min-height:64px; }
    .ep-cal-day > div:first-child { font-size:11.5px; }
    .ep-cal-event { font-size:9px; padding:2px 4px; margin-bottom:2px; }
  }
</style>

// ---- google.script.run wrapper — identical contract to the previous
//      Component.js runScript_, calling the SAME API.gs functions,
//      unchanged. This is the only way this file talks to the backend. ----
function runScript_(fnName, args) {
  return new Promise(function (resolve) {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      resolve({ ok: false, error: 'Not running inside Google Apps Script (google.script.run unavailable).' });
      return;
    }
    google.script.run
      .withSuccessHandler(function (res) { resolve(res); })
      .withFailureHandler(function (err) { resolve({ ok: false, error: (err && err.message) || String(err) }); })
      [fnName].apply(null, args || []);
  });
}

// ---- HTML escaping — mandatory since we build markup with string
//      interpolation instead of a framework that auto-escapes JSX children.
//      Every piece of workbook-sourced or user-typed text goes through esc()
//      before it lands in innerHTML. ----
function esc(v) {
  if (v === null || typeof v === 'undefined') return '';
  return String(v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function escAttr(v) { return esc(v); }

// ============================================================
// RECOVERY RC2 — hardened initial-load path. Same transport as before
// (direct google.script.run call to api_getPlannerData(), no manual
// JSON.stringify/parse layer, no change to the API contract) — this
// only adds a client-side timeout and distinguishes *why* a load
// failed, so a real failure report can say more than "didn't work."
// Every other api_* call in this file still goes through the
// original, unmodified runScript_() below — this dedicated path is
// scoped to the initial boot load only, per RC2's "don't alter the
// UI beyond loading/error diagnostics" constraint.
// ============================================================
var LOAD_TIMEOUT_MS = 30000;

function loadPlannerDataRaw_() {
  return new Promise(function (resolve) {
    var settled = false;
    var timeoutId = setTimeout(function () {
      if (settled) return;
      settled = true;
      resolve({ kind: 'timeout' });
    }, LOAD_TIMEOUT_MS);

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      if (settled) return;
      settled = true;
      clearTimeout(timeoutId);
      resolve({ kind: 'no-bridge' });
      return;
    }

   google.script.run
  .withSuccessHandler(function (jsonText) {
    if (settled) return;
    settled = true;
    clearTimeout(timeoutId);

    try {
      if (!jsonText) {
        resolve({
          kind: 'success',
          payload: {
            ok: false,
            error: 'The server returned no response.'
          }
        });
        return;
      }

      var parsed = JSON.parse(jsonText);

      resolve({
        kind: 'success',
        payload: parsed
      });

    } catch (error) {
      resolve({
        kind: 'success',
        payload: {
          ok: false,
          error:
            'Could not parse planner data: ' +
            (error && error.message
              ? error.message
              : String(error))
        }
      });
    }
  })
  .withFailureHandler(function (err) {
    if (settled) return;
    settled = true;
    clearTimeout(timeoutId);

    resolve({
      kind: 'failure-handler',
      error:
        (err && err.message)
          ? err.message
          : String(err)
    });
  })
  .api_getPlannerDataJson();
});
}

// v1.1.12 -- feature 4 support: in-flight guard (never start a second
// concurrent load while one is already running) and a last-successful-load
// timestamp (used by the visibilitychange listener near boot() below to
// decide whether "at least five minutes" have passed). Record time is
// updated only on a genuinely successful load, not on failures -- so a
// failed background refresh will be retried the next time the tab becomes
// visible, rather than silently suppressed for five more minutes.
var _loadInFlight = false;
var _lastSuccessfulLoadAt = 0;

function loadPlannerData() {
  if (_loadInFlight) return Promise.resolve(); // in-flight guard
  _loadInFlight = true;
  return loadPlannerDataRaw_().then(function (outcome) {
    _loadInFlight = false;
    state.booted = true;

    if (outcome.kind === 'timeout') {
      state.loadError =
        'Timed out waiting for the workbook (' +
        (LOAD_TIMEOUT_MS / 1000) +
        's). The request may still be running on Google\'s side — try again in a moment.';
      render();
      return;
    }

    if (outcome.kind === 'no-bridge') {
      state.loadError =
        'Not running inside Google Apps Script (google.script.run unavailable).';
      render();
      return;
    }

    if (outcome.kind === 'failure-handler') {
      state.loadError = 'Apps Script reported an error before returning any data: ' + outcome.error;
      render();
      return;
    }

    // outcome.kind === 'success' from here on — but "the success handler fired" doesn't by
    // itself mean the payload is usable, so every shape is checked explicitly rather than
    // assumed.
    var res = outcome.payload;

    if (!res) {
      state.loadError = 'The server returned no response.';
      render();
      return;
    }

    if (typeof res !== 'object') {
      state.loadError = 'The server returned an unexpected payload (expected an object, got ' + (typeof res) + ').';
      render();
      return;
    }

    if (res.ok === false) {
      state.loadError = res.error || 'The backend reported a failure without an error message.';
      render();
      return;
    }

    if (res.ok !== true) {
      state.loadError = 'The server returned an unrecognized response shape (missing a valid "ok" field).';
      render();
      return;
    }

    if (!res.data || typeof res.data !== 'object') {
      state.loadError = 'The server reported success but the workbook payload was missing or malformed.';
      render();
      return;
    }

    state.loadError = null;
    state.raw = res.data;
    state.localNotes = Object.assign({}, res.data.notes);
    state.localSettings = Object.assign({}, res.data.settings);
    _lastSuccessfulLoadAt = Date.now();
    render();
  });
}

function saveMarkEntry(code, moduleName, moduleAfItemType) {
  var form = getMarkForm_(code);
  if (form.saving) return; // double-submit guard
  var mark = parseFloat(form.mark), max = parseFloat(form.max);
  if (form.type === 'AF' && !(form.name || '').trim()) { setMarkField_(code, 'error', 'Give this assessment a name (e.g. "Tutorial Test 4").'); render(); return; }
  if (!Number.isFinite(mark) || !Number.isFinite(max) || max <= 0) { setMarkField_(code, 'error', 'Enter a valid mark and maximum mark.'); render(); return; }
  if (mark < 0 || mark > max * 1.05) { setMarkField_(code, 'error', 'Mark should be between 0 and the maximum.'); render(); return; }
  // v1.4.1 -- Item type: locked to the module's own AF item type when set

  var lockedItemType = moduleAfItemType === 'Tutorial tests' ? 'Tutorial test' : moduleAfItemType === 'Practicals' ? 'Practical' : null;
  var itemType = lockedItemType || form.itemType;

  var payload = Object.assign({}, form, { itemType: itemType });

<script>
'use strict';

// ---- attribute-safe event-handler string builders. Every value passed
//      through JSON.stringify + esc() so arbitrary workbook text (quotes,
//      ampersands, unicode) can never break the markup or inject script. ----
function h_(fnName, args) {
  return esc(fnName + '(' + (args || []).map(function (a) { return JSON.stringify(a); }).join(',') + ')');
}
function hv_(fnName, args) {
  var pre = (args || []).map(function (a) { return JSON.stringify(a); }).join(',');
  return esc(fnName + '(' + (pre ? pre + ',' : '') + 'this.value)');
}

var DAY_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var SETTINGS_SHEET_LABELS = {
  semesterName: 'Semester name', semesterStart: 'Semester start date', semesterEnd: 'Semester end date',
  calendarId: 'Planner Calendar ID (read/write)', reminder1: 'Default reminder 1 (days before)', reminder2: 'Default reminder 2 (days before)'
};
function setSettingInput(field, value) { setSettingField_(SETTINGS_SHEET_LABELS[field], field, value); }
function setNoteInput(field, value) { setNoteField(field, field, value); }

// ============================================================
// v1.1.12 master -- Features 7 & 8: one shared countdown formatter and one
// shared date-label formatter, used everywhere a raw "Days remaining" number
// or a raw ISO date string would otherwise have been shown verbatim. Neither
// function ever writes anything back -- both are pure display transforms
// over numbers/strings the backend already computed and sent as-is.
// ============================================================

// Exact rules (per spec): <-1 -> "Overdue by N days" (N = ceil(-days));
// -1..<0 -> "Overdue by 1 day"; 0..<1 -> "Today"; 1..<2 -> "Tomorrow";
// >=2 -> "N days left" (N = ceil(days)). Examples: 9.0769 -> "10 days left",
// 1.4 -> "Tomorrow", 0.2 -> "Today", -2.1 -> "Overdue by 3 days".
function formatCountdown_(days) {
  if (typeof days !== 'number' || !isFinite(days)) return '';
  if (days < -1) return 'Overdue by ' + Math.ceil(-days) + ' days';
  if (days < 0) return 'Overdue by 1 day';
  if (days < 1) return 'Today';
  if (days < 2) return 'Tomorrow';
  return Math.ceil(days) + ' days left';
}

// Urgency color tiers -- always paired with the text above (never
// color-only): >14 green/neutral, 7-14 yellow, 2-6 orange, Today/Tomorrow
// red, overdue dark red.
function countdownColor_(days) {
  if (typeof days !== 'number' || !isFinite(days)) return '#8A7A68';
  if (days < 0) return '#7A2020';
  if (days < 2) return '#A6392E';
  if (days <= 6) return '#B24B2E';
  if (days <= 14) return '#B58821';
  return '#3F7A5C';
}

// Parses a date-ONLY "YYYY-MM-DD" string as a local calendar date (no
// timezone conversion at all), matching the existing combineDateAndTime_
// server-side convention of never letting a bare date drift a day via UTC
// parsing. Returns null for anything that isn't a clean date-only string.
function parseIsoDateLocal_(iso) {
  if (!iso || typeof iso !== 'string') return null;
  var p = iso.split('-');
  if (p.length !== 3) return null;
  var y = Number(p[0]), m = Number(p[1]), d = Number(p[2]);
  if (!isFinite(y) || !isFinite(m) || !isFinite(d)) return null;
  var dt = new Date(y, m - 1, d);
  return isNaN(dt.getTime()) ? null : dt;
}

// e.g. "Friday, 24 July" (year omitted when it's the current year, per spec).
// Never alters the underlying ISO string -- purely a display transform.
function formatLocalDateOnly_(iso) {
  var d = parseIsoDateLocal_(iso);
  if (!d) return iso || '';
  var label = DAY_NAMES[d.getDay()] + ', ' + d.getDate() + ' ' + MONTH_NAMES[d.getMonth()];
  var nowYear = new Date().getFullYear();
  return d.getFullYear() === nowYear ? label : label + ' ' + d.getFullYear();
}

// e.g. "20–26 July 2026" or, across a month boundary, "28 July – 3 August".
function formatWeekRangeLabel_(mondayIso, fridayIso) {
  var m = parseIsoDateLocal_(mondayIso), f = parseIsoDateLocal_(fridayIso);
  if (!m || !f) return '';
  var nowYear = new Date().getFullYear();
  var yearSuffix = (f.getFullYear() === nowYear) ? '' : (' ' + f.getFullYear());
  if (m.getMonth() === f.getMonth()) return m.getDate() + '–' + f.getDate() + ' ' + MONTH_NAMES[f.getMonth()] + yearSuffix;
  return m.getDate() + ' ' + MONTH_NAMES[m.getMonth()] + ' – ' + f.getDate() + ' ' + MONTH_NAMES[f.getMonth()] + yearSuffix;
}

// ============================================================
// v1.1.12 master -- Feature 10 (Weekly Timetable preview) helper functions.
// weeklyShiftDays_/currentMondayIso_ are pure local-date arithmetic (no
// timezone conversion, no Sheets/Calendar calls) so Prev/Next/This-week
// navigation never needs a round trip just to compute which week to ask
// the backend for.
// ============================================================
function currentMondayIso_() {
  var now = new Date();
  var dow = (now.getDay() + 6) % 7;
  var d = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dow);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function weeklyShiftDays_(iso, deltaDays) {
  var d = parseIsoDateLocal_(iso) || new Date();
  d.setDate(d.getDate() + deltaDays);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
// Given any ISO date, returns the Monday of that same week -- same (getDay()+6)%7
// trick as the backend's mondayOfWeek_, used here only to derive "first
// teaching week" from the Settings semester-start date (Feature 10's
// optional empty-state link), never to compute anything that gets saved.
function weeklyShiftDaysToMonday_(iso) {
  var d = parseIsoDateLocal_(iso);
  if (!d) return null;
  var dow = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - dow);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

var _weeklyLoadInFlight = false;
function weeklyLoadWeek_(anchorIso) {
  if (_weeklyLoadInFlight) return;
  _weeklyLoadInFlight = true;
  state.weeklyLoading = true;
  render();
  runScript_('api_getWeekTimetable', [anchorIso]).then(function (res) {
    _weeklyLoadInFlight = false;
    state.weeklyLoading = false;
    if (res && res.ok) {

    } else {
      showToast_('error', 'Could not load that week: ' + (res && res.error ? res.error : 'unknown error'));
    }

  }).catch(function () {
    _weeklyLoadInFlight = false;
    state.weeklyLoading = false;
    showToast_('error', 'Could not load that week.');
    render();
  });
}
function weeklyGoPrev() {
  var base = (state.weeklyPreview && state.weeklyPreview.mondayIso) || currentMondayIso_();
  weeklyLoadWeek_(weeklyShiftDays_(base, -7));
}
function weeklyGoNext() {
  var base = (state.weeklyPreview && state.weeklyPreview.mondayIso) || currentMondayIso_();
  weeklyLoadWeek_(weeklyShiftDays_(base, 7));
}
function weeklyGoToday() {
  // Falls back to the boot-loaded current week -- no extra request needed,

  state.weeklyPreview = null;
  render();
}

}

// ---- The single source of derived view data for every screen. Same
//      derivation logic as the previous Component.js renderVals(), ported
//      function-for-function. Nothing here re-implements a spreadsheet
//      projection — every AF/A1/A2/A3/pass/subminimum/risk value below is
//      read straight from raw.marksTracker / raw.modules, never recomputed. ----
function computeViewModel() {
  if (!state.booted) return emptyViewModel_(null);
  if (state.loadError) return emptyViewModel_(state.loadError);
  var raw = state.raw;

  var modules = raw.modules;
  var byId = {}, byName = {}, byCode = {};
  modules.forEach(function (m) { byId[m.id] = m; byName[m.name] = m; byCode[m.code] = m; });

  var navDefs = [
    { group: 'OVERVIEW', items: [['home', 'Home'], ['dashboard', 'Dashboard'], ['timeline', 'Semester Timeline']] },
    { group: 'PLAN', items: [['calendar', 'Calendar'], ['weekly', 'Weekly Timetable'], ['inbox', 'Academic Inbox']] },
    { group: 'WORK', items: [['assignments', 'Assignments'], ['assessments', 'Assessments'], ['study', 'Study Planner'], ['revision', 'Revision Tracker']] },
    { group: 'MARKS', items: [['marks', 'Marks Tracker'], ['af', 'AF Components'], ['modules', 'Module Overview'], ['rules', 'Module Rules']] },
    { group: 'REFERENCE', items: [['resources', 'Resources'], ['notes', 'Notes'], ['attendance', 'Attendance']] },
    // v1.4.0 -- new 'semester' entry, additive only. 'archive' (the v1.1-era
    // quick tools) is left exactly where it was; Semester Lifecycle &
    // Analytics is a new, separate, considerably more complete screen.
    { group: 'SYSTEM', items: [['automation', 'Automation'], ['archive', 'Archive / New Semester'], ['semester', 'Semester Lifecycle'], ['settings', 'Settings'], ['guide', 'User Guide']] }
  ];
  var navGroups = navDefs.map(function (g) {
    return {
      label: g.group,
      items: g.items.map(function (pair) {
        var id = pair[0], label = pair[1];
        return { id: id, label: label, active: state.view === id };
      })
    };
  });
  var allNavFlat = [];
  navDefs.forEach(function (g) { g.items.forEach(function (pair) {
    var id = pair[0], label = pair[1];
    allNavFlat.push({ id: id, label: label, blurb: NAV_BLURBS[id] || 'Open section' });
  }); });

      // through to the card so "Create catch-up study task" can pass it to
      // the backend instead of silently omitting it.
      key: key, module: s.module, type: s.type, time: s.time, venue: s.venue || '', color: s.color,
      status: status, busy: !!state.attendanceBusyKeys[key], dateIso: sessionDate
    };
  });

  // v1.2.0 -- Resources: add stable ID, status, and the four generic
  // progress flags (relabelled per resource type via RESOURCE_PROGRESS_LABELS
  // above), plus inline add/edit form state.
  var resources = raw.resources.map(function (r) {
    var mod = byName[r.module];
    var key = r.module + '__' + r.title;
    var reviewed = (key in state.localResourcesReviewed) ? state.localResourcesReviewed[key] : r.reviewed;
    var statusColors = RESOURCE_STATUS_COLORS[r.status] || RESOURCE_STATUS_COLORS['Not started'];
    var flagLabels = RESOURCE_PROGRESS_LABELS[r.type] || RESOURCE_PROGRESS_LABELS.Other;
    return {
      resourceId: r.resourceId || '', title: r.title, module: r.module, type: r.type, topic: r.topic || '',
      link: r.link || '', notes: r.notes || '', priority: r.priority || 'Medium',
      color: mod ? mod.color : '#8B8B87', key: key, checkStyle: reviewed ? CHECK_ON : CHECK_OFF,
      status: r.status || 'Not started', statusBg: statusColors[0], statusColor: statusColors[1],
      flagA: !!r.flagA, flagB: !!r.flagB, flagC: !!r.flagC, flagD: !!r.flagD,
      flagLabelA: flagLabels[0], flagLabelB: flagLabels[1], flagLabelC: flagLabels[2], flagLabelD: flagLabels[3],
      flashcardsCreated: !!r.flashcardsCreated, score: (typeof r.score === 'number') ? Math.round(r.score) + '%' : '—',
      isEditing: state.resourceEditingId === r.resourceId
    };
  });

  // v1.2.0 -- Activity history: category + a human message built from the
  // (now human-labelled server-side) action/item text, so the Automation
  // screen never has to show a bare stable ID as its primary label.
  function activityCategory_(action) {
    var a = (action || '').toLowerCase();
    if (a.indexOf('inbox') !== -1) return 'Inbox';
    if (a.indexOf('calendar') !== -1) return 'Calendar';
    if (a.indexOf('study') !== -1 || a.indexOf('revision') !== -1 || a.indexOf('independent') !== -1 || a.indexOf('catch-up') !== -1) return 'Study';
    if (a.indexOf('resource') !== -1) return 'Resources';
    if (a.indexOf('mark') !== -1 || a.indexOf('af ') === 0 || a.indexOf('af entry') !== -1 || a.indexOf('af flag') !== -1) return 'Marks';
    if (a.indexOf('setting') !== -1 || a.indexOf('module configuration') !== -1 || a.indexOf('archive') !== -1 || a.indexOf('semester') !== -1 || a.indexOf('automation') !== -1) return 'Settings';
    return 'Other';
  }
  var syncLog = raw.syncLog.map(function (l) {
    var category = activityCategory_(l.action);
    var isError = /^error/i.test((l.result || '').toString()) || /^fail/i.test((l.result || '').toString());
    var item = (l.item && l.item !== '-') ? l.item : '';
    return {
      item: l.item || l.action, result: l.result, action: l.action, category: category, isError: isError,
      message: item ? (l.action + ' — "' + item + '"') : l.action,
      subtitle: [l.result, l.detail].filter(Boolean).join(' · '),
      timestamp: l.timestamp,
      color: isError ? '#A6392E' : '#3F7A5C'
    };
  });
  var syncLogFiltered = syncLog.filter(function (l) {
    if (state.activityFilter === 'All') return true;
    if (state.activityFilter === 'Errors') return l.isError;
    return l.category === state.activityFilter;
  });
  // Real "last ran" summaries for the Automation screen. Previously these
  // were hardcoded ("last ran 6 min ago" / "last ran 12 min ago") regardless
  // of raw.syncLog. Fixed here using the same log data already fetched by
  // api_getPlannerData — no backend change needed.
  var lastInboxLog = raw.syncLog.filter(function (l) { return /inbox/i.test(l.action || l.item || ''); })[0];
  var lastCalendarLog = raw.syncLog.filter(function (l) { return /calendar/i.test(l.action || l.item || ''); })[0];
  var automationLastRun = {
    inbox: lastInboxLog ? (lastInboxLog.timestamp + ' · ' + lastInboxLog.result) : 'No run logged yet',
    calendar: lastCalendarLog ? (lastCalendarLog.timestamp + ' · ' + lastCalendarLog.result) : 'No run logged yet',
    enabled: !!(raw.automationStatus && raw.automationStatus.enabled)
  };

  var archiveRows = raw.archiveRows.map(function (r) { return { semester: r.semester, module: r.module, mark: r.mark, status: r.status, color: '#3F7A5C' }; });
  var guideEntries = (raw.guideEntries && raw.guideEntries.length) ? raw.guideEntries : GUIDE_FALLBACK;

  var flags = {};
  ['home', 'dashboard', 'calendar', 'weekly', 'inbox', 'assignments', 'assessments', 'marks', 'af', 'study', 'revision', 'modules', 'rules', 'resources', 'notes', 'attendance', 'timeline', 'settings', 'automation', 'archive', 'semester', 'guide']
    .forEach(function (id) { flags['is' + id[0].toUpperCase() + id.slice(1)] = state.view === id; });

  return Object.assign({
    navGroups: navGroups, allNavFlat: allNavFlat, modules: modules, legendModules: legendModules,
    todayClasses: todayClasses, todayTutorials: todayTutorials, countdowns: countdowns, nextAssessmentLabel: nextAssessmentLabel,
    hoursByModule: hoursByModule, totalHours: Math.round(totalHours * 10) / 10, moduleHealth: moduleHealth, phases: phases, todayStudyBlock: todayStudyBlock,
    weekdayLabels: WEEKDAY_LABELS, calendarDays: calendarDays, weekDays: weekDays,
    externalCalendarLoading: state.externalCalendarLoading, externalCalendarReason: state.externalCalendarReason,
    weekDaysForDisplay: weeklyView.weekDays,
    weeklyRangeLabel: formatWeekRangeLabel_(weeklyView.mondayIso, weeklyView.fridayIso),
    weeklyIsCurrentWeek: !!weeklyView.isCurrentWeek,
    weeklyAllEmpty: weeklyAllEmpty,
    weeklyLoading: !!state.weeklyLoading,
    weeklyFirstTeachingWeekIso: weeklyFirstTeachingWeekIso,
    calendarMonthLabel: calendarMonthLabel, calendarPhaseLabel: calendarPhaseLabel,
    moduleFilterChips: moduleFilterChips, agendaItems: agendaItems,
    inboxItems: inboxItems, assignments: assignments, assessments: assessments, marksCards: marksCards, marksRulesTable: marksRulesTable,
    afGroups: afGroups, studySessions: studySessions, revisionRows: revisionRows,
    attendance: attendance, todayMandatorySessions: todayMandatorySessions,
    resources: resources, syncLog: syncLog, syncLogFiltered: syncLogFiltered, activityFilter: state.activityFilter,
    automationLastRun: automationLastRun, archiveRows: archiveRows, guideEntries: guideEntries,
    notes: state.localNotes, settings: state.localSettings,
    studySessionFormOpen: state.studySessionFormOpen, studySessionForm: state.studySessionForm, studySessionEditingId: state.studySessionEditingId,
    independentStudyFormOpen: state.independentStudyFormOpen, independentStudyForm: state.independentStudyForm,
    suggestionsPreview: state.suggestionsPreview, suggestionsLoading: state.suggestionsLoading,
    suggestionsWeekOffset: state.suggestionsWeekOffset,
    resourceFormOpen: state.resourceFormOpen, resourceForm: state.resourceForm, resourceEditingId: state.resourceEditingId,
    driveUploadFormOpen: state.driveUploadFormOpen, driveUploadForm: state.driveUploadForm, driveUploadSaving: state.driveUploadSaving,
    driveUploadFileChosenName: state.driveUploadFileChosenName,
    revisionFormOpen: state.revisionFormOpen, revisionForm: state.revisionForm, revisionEditForm: state.revisionEditForm,
    moduleConfigFormOpenByCode: state.moduleConfigFormOpenByCode, moduleConfigForms: state.moduleConfigForms,
    todayLabelFull: DAY_NAMES[now.getDay()].toUpperCase() + ' · ' + now.getDate() + ' ' + MONTH_NAMES[now.getMonth()].toUpperCase() + ' ' + now.getFullYear(),
    // v1.3.0 -- Deterministic Academic Intelligence. Every field below is a
    // direct pass-through of what api_getPlannerData already computed
    // server-side (computeAcademicIntelligence_ in API_v1.3.0.gs) -- this
    // file never re-derives a priority, an hour, or a trend client-side.
    priorities: raw.priorities || [], nextAction: raw.nextAction || null,
    resourceInsights: raw.resourceInsights || [], examFocus: raw.examFocus || { triggers: [], active: [] },
    improvementTracker: raw.improvementTracker || [],
    weeklyAllocationCapacity: (raw.weeklyAllocation || {}).capacityHours || 0,
    weeklyAllocationTotal: (raw.weeklyAllocation || {}).totalAllocated || 0,
    weeklyAllocation: ((raw.weeklyAllocation || {}).allocations || []).map(function (a) {
      var override = state.weeklyAllocationOverrides[a.code];
      return Object.assign({}, a, { displayHours: (typeof override === 'number') ? override : a.hours, isOverridden: typeof override === 'number' });
    }),
    examFocusPreview: state.examFocusPreview, examFocusPreviewLoading: state.examFocusPreviewLoading,
    examFocusApprovedSkips: state.examFocusApprovedSkips, examFocusApprovedNew: state.examFocusApprovedNew,
    // v1.3.0 Marks Intelligence expansion -- marksIntelligence is a direct
    // pass-through of computeAcademicIntelligence_'s output (never re-derived
    // client-side, same principle as every other v1.3.0 field above). The
    // A3 custom-target fields are pure local UI state (what the user has
    // typed, and the last on-demand api_computeCustomA3Recovery result).
    // v1.3.1: attach each module's raw "Published Final (Before A3)" value
    // (from 11 Marks Tracker, via api_getPlannerData's marksTracker rows --
    // never recomputed) onto its marksIntelligence entry, purely so the
    // input field below can default to what's already saved.
    marksIntelligence: (raw.marksIntelligence || []).map(function (mi) {
      var mt = (raw.marksTracker || []).filter(function (r) { return r.module === mi.name; })[0];
      return Object.assign({}, mi, {
        publishedFinalBeforeA3: mt ? mt.publishedFinalBeforeA3 : null,
        publishedFinalAfterA3: mt ? mt.publishedFinalAfterA3 : null
      });
    }),
    a3CustomTargetInput: state.a3CustomTargetInput, a3CustomResult: state.a3CustomResult,
    a3CustomLoading: state.a3CustomLoading, a3CustomError: state.a3CustomError,
    marksIntelligenceExpanded: state.marksIntelligenceExpanded,
    // v1.3.1 Marks Intelligence Completion -- pure local UI state pass-through.
    publishedFinalInput: state.publishedFinalInput, publishedFinalSaving: state.publishedFinalSaving,
    publishedFinalAfterInput: state.publishedFinalAfterInput, publishedFinalAfterSaving: state.publishedFinalAfterSaving,
    whatIfInput: state.whatIfInput, whatIfResult: state.whatIfResult, whatIfLoading: state.whatIfLoading,
    whatIfError: state.whatIfError, whatIfOpen: state.whatIfOpen,
    // v1.3.1 2nd correction pass -- pure local UI state pass-through.
    assessmentStatusInput: state.assessmentStatusInput, assessmentStatusSaving: state.assessmentStatusSaving,
    dcaMarkInput: state.dcaMarkInput, dcaMarkSaving: state.dcaMarkSaving,
    // v1.4.0 Semester Lifecycle & Analytics -- pure local UI state pass-through
    // (semData/semReportView/semHistory are populated by their own on-demand
    // api_sem* calls, the same lazy-load pattern Study Suggestions already uses).
    semLoading: state.semLoading, semData: state.semData, semReportView: state.semReportView,
    semReflection: state.semReflection, semDeleteFlow: state.semDeleteFlow, semDeleteCalendarEvents: state.semDeleteCalendarEvents,
    semBackupBusy: state.semBackupBusy, semTemplatesBusy: state.semTemplatesBusy, semFinishBusy: state.semFinishBusy,
    semCompareView: state.semCompareView, semHistory: state.semHistory, semWizard: state.semWizard
  }, flags);
}
</script>
<script>
'use strict';

// ============================================================
// RENDER — one function builds the entire page as an HTML string
// and replaces #app's innerHTML. No virtual DOM, no diffing: for
// this app's data volume (six modules, a few dozen rows per
// table) a full re-render on every interaction is fast and,
// crucially, impossible to get subtly wrong the way a hand-rolled
// diff could be. Scroll position is preserved manually across
// re-renders that don't change screens.
// ============================================================
function render() {
  var scrollY = window.scrollY;
  var vm = computeViewModel();
  var html = state.booted && !state.loadError ? renderApp_(vm) : renderBootScreen_(vm);
  document.getElementById('app').innerHTML = html;
  window.scrollTo(0, scrollY);
}

function renderBootScreen_(vm) {
  if (state.loadError) {
    return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6E3D1;font-family:\'Inter\',sans-serif;padding:24px;">' +
      '<div style="max-width:460px;background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:28px;text-align:center;">' +
      '<div style="font-size:34px;margin-bottom:10px;">⚠</div>' +
      '<div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:28px;color:#8F3B23;margin-bottom:8px;">Could not load the workbook</div>' +
      '<div style="font-size:14px;color:#8A7A68;margin-bottom:18px;">' + esc(state.loadError) + '</div>' +
      '<div onclick="' + h_('loadPlannerData', []) + '" style="display:inline-block;background:#DD7A56;color:#fff;font-weight:700;padding:11px 22px;border-radius:10px;cursor:pointer;">Try again</div>' +
      '</div></div>';
  }
  return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6E3D1;font-family:\'Inter\',sans-serif;color:#8A7A68;flex-direction:column;gap:14px;">' +
    '<div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:34px;color:#3B332B;">Engineering Planner</div>' +
    '<div>Loading your workbook…</div></div>';
}

function toastHtml_() {
  var t = toastVals_();
  if (!t.visible) return '';
  return '<div style="position:fixed;bottom:24px;right:24px;z-index:9999;max-width:340px;background:' + t.bg + ';color:' + t.color + ';border:1px solid ' + t.border + ';border-radius:14px;padding:14px 18px;box-shadow:0 6px 20px rgba(59,51,43,0.18);font-size:13.5px;font-family:\'Inter\',sans-serif;display:flex;align-items:flex-start;gap:10px;" class="ep-fade-in">' +
    '<div style="flex:1;">' + esc(t.message) + '</div>' +
    '<div onclick="' + h_('dismissToast', []) + '" style="cursor:pointer;font-weight:700;opacity:.6;">&#10005;</div>' +
    '</div>';
}

function modalHtml_() {
  var m = state.modal;
  if (!m) return '';
  var body = '<div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:26px;margin-bottom:10px;color:#3B332B;">' + esc(m.title) + '</div>' +
    '<div style="font-size:14px;color:#5A4D40;line-height:1.5;margin-bottom:16px;">' + esc(m.message) + '</div>';
  if (m.kind === 'prompt') {
    body += '<input value="' + escAttr(m.value) + '" oninput="' + hv_('setModalValue', []) + '" placeholder="Name…" style="width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;margin-bottom:16px;" autofocus>';
  }
  // v1.4.0 -- typed-confirmation input (Delete Semester's "DELETE SEMESTER"
  // phrase). Shows the required phrase explicitly and gives live feedback
  // (border colour) on whether the current input matches yet.
  if (m.kind === 'typedConfirm') {
    var matches = (m.value || '') === m.requiredPhrase;
    // Uses setModalValueLive_ (direct DOM update, no full render()) rather
    // than the plain setModalValue used by 'prompt' above -- this input
    // needs live visual feedback (border colour + Confirm button enabled
    // state) on every keystroke, and a full render() on every keystroke
    // would rebuild the input and drop keyboard focus/cursor position.
    body += '<div style="font-size:12.5px;font-weight:700;color:#A6392E;margin-bottom:8px;">Type <span style="font-family:monospace;background:#F7E2D8;padding:2px 6px;border-radius:6px;">' + esc(m.requiredPhrase) + '</span> to confirm:</div>' +
      '<input id="sem-typed-confirm-input" value="' + escAttr(m.value) + '" oninput="' + hv_('setModalValueLive_', []) + '" placeholder="' + escAttr(m.requiredPhrase) + '" style="width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:2px solid ' + (matches ? '#3F7A5C' : '#A6392E') + ';font-size:14px;font-family:\'Inter\',sans-serif;margin-bottom:16px;" autofocus autocomplete="off" spellcheck="false">';
  }
  var buttonsHtml;
  if (m.kind === 'choice') {
    // v1.1.12 master -- N custom choices + an always-present Cancel, instead
    // of the fixed Confirm/Cancel pair below.
    var choiceBtns = m.choices.map(function (c, i) {
      var bg = c.primary ? '#DD7A56' : '#F3E3D2', color = c.primary ? '#fff' : '#3B332B';
      return '<div onclick="' + h_('runModalChoice_', [i]) + '" style="flex:1;min-width:120px;text-align:center;background:' + bg + ';color:' + color + ';font-weight:700;font-size:13px;padding:11px 8px;border-radius:10px;cursor:pointer;">' + esc(c.label) + '</div>';
    }).join('');
    buttonsHtml = '<div style="display:flex;gap:8px;flex-wrap:wrap;">' + choiceBtns +
      '<div onclick="' + h_('closeModal', []) + '" style="flex:1;min-width:120px;text-align:center;background:#F3E3D2;color:#3B332B;font-weight:600;font-size:13px;padding:11px 8px;border-radius:10px;cursor:pointer;">Cancel</div></div>';
  } else {
    // v1.4.0 -- for 'typedConfirm', the Confirm button is visually disabled
    // (dimmed, not clickable-looking) until the typed phrase matches;
    // confirmModal() itself is the real enforcement (see above), this is
    // purely so the disabled state is honestly represented on screen too.
    var typedOk = m.kind !== 'typedConfirm' || (m.value || '') === m.requiredPhrase;
    buttonsHtml = '<div style="display:flex;gap:10px;">' +
      '<div id="sem-typed-confirm-btn" onclick="' + (typedOk ? h_('confirmModal', []) : '') + '" style="flex:1;text-align:center;background:' + (typedOk ? '#DD7A56' : '#E7C7A9') + ';color:#fff;font-weight:700;font-size:14px;padding:11px;border-radius:10px;cursor:' + (typedOk ? 'pointer' : 'default') + ';opacity:' + (typedOk ? '1' : '.7') + ';">Confirm</div>' +
      '<div onclick="' + h_('closeModal', []) + '" style="flex:1;text-align:center;background:#F3E3D2;color:#3B332B;font-weight:600;font-size:14px;padding:11px;border-radius:10px;cursor:pointer;">Cancel</div>' +
      '</div>';
  }
  return '<div style="position:fixed;inset:0;background:rgba(59,51,43,0.35);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;">' +
    '<div style="background:#FDF6F0;border-radius:18px;padding:26px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.25);" class="ep-fade-in">' +
    body + buttonsHtml +
    '</div></div>';
}

// v1.1.12 master -- Feature 9 (iPad responsiveness). The sidebar and app
// shell now use CSS classes (defined in the <style> block, see ep-shell/
// ep-sidebar/ep-content/ep-navtoggle/ep-navbackdrop) instead of purely
// inline styles, specifically so the tablet/portrait media queries below can
// override them -- inline styles can't be overridden by @media rules. The
// visual result at desktop widths (>1200px) is byte-for-byte the same
// layout as before; only the mechanism (class vs. inline) changed.
function navHtml_(vm) {
  var groups = vm.navGroups.map(function (g) {
    var items = g.items.map(function (item) {
      var style = 'display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;cursor:pointer;background:' + (item.active ? '#F7CBAE' : 'transparent') + ';color:' + (item.active ? '#8F3B23' : '#3B332B') + ';font-weight:' + (item.active ? '700' : '500') + ';';
      // closeNav() after navigating so the portrait drawer doesn't stay open
      // over the newly selected screen.
      return '<div class="ep-nav-row" onclick="' + h_('setView', [item.id]) + ';' + h_('closeNav', []) + '" style="' + style + '"><span style="font-size:14.5px;">' + esc(item.label) + '</span></div>';
    }).join('');
    return '<div style="display:flex;flex-direction:column;gap:3px;">' +
      '<div style="font-size:10.5px;letter-spacing:1.4px;font-weight:700;color:#A88E76;padding:10px 10px 4px;">' + esc(g.label) + '</div>' + items + '</div>';
  }).join('');
  return '<div class="ep-sidebar' + (state.navOpen ? ' ep-open' : '') + '">' +
    '<div style="padding:0 8px;">' +
    '<div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:34px;color:#3B332B;line-height:1;">Engineering Planner</div>' +
    '<div style="font-size:11px;letter-spacing:1.5px;color:#B24B2E;font-weight:700;margin-top:6px;">SEMESTER 2 · 2026</div>' +
    '</div>' + groups + '</div>';
}

function renderApp_(vm) {
  // ep-navtoggle (hamburger) and ep-navbackdrop only ever become visible via
  // the portrait-tablet media query below -- at desktop/landscape widths
  // they're display:none and inert.
  return '<div class="ep-shell">' +
    toastHtml_() + modalHtml_() + navHtml_(vm) +
    (state.navOpen ? '<div class="ep-navbackdrop" onclick="' + h_('closeNav', []) + '"></div>' : '') +
    '<div class="ep-content">' +
    '<div class="ep-navtoggle" onclick="' + h_('toggleNav', []) + '">☰ Menu</div>' +
    screenHtml_(vm) + '</div>' +
    '</div>';
}

function screenHtml_(vm) {
  if (vm.isHome) return screenHome_(vm);
  if (vm.isDashboard) return screenDashboard_(vm);
  if (vm.isCalendar) return screenCalendar_(vm);
  if (vm.isWeekly) return screenWeekly_(vm);
  if (vm.isInbox) return screenInbox_(vm);
  if (vm.isAssignments) return screenAssignments_(vm);
  if (vm.isAssessments) return screenAssessments_(vm);
  if (vm.isMarks) return screenMarks_(vm);
  if (vm.isAf) return screenAf_(vm);
  if (vm.isStudy) return screenStudy_(vm);
  if (vm.isRevision) return screenRevision_(vm);
  if (vm.isModules) return screenModules_(vm);
  if (vm.isRules) return screenRules_(vm);
  if (vm.isPriority) return screenPriority_(vm);
  if (vm.isResources) return screenResources_(vm);
  if (vm.isNotes) return screenNotes_(vm);
  if (vm.isAttendance) return screenAttendance_(vm);
  if (vm.isTimeline) return screenTimeline_(vm);
  if (vm.isSettings) return screenSettings_(vm);
  if (vm.isAutomation) return screenAutomation_(vm);
  if (vm.isArchive) return screenArchive_(vm);
  if (vm.isSemester) return screenSemester_(vm);
  if (vm.isGuide) return screenGuide_(vm);
  return '';
}
</script>
<script>
'use strict';

function screenHome_(vm) {
  var tiles = vm.allNavFlat.map(function (item) {
    return '<div class="ep-clickable" onclick="' + h_('setView', [item.id]) + '" style="width:220px;background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:8px;">' +
      '<div style="width:36px;height:36px;border-radius:10px;background:' + NAV_TINTS[item.id] + ';"></div>' +
      '<div style="font-weight:700;font-size:16px;">' + esc(item.label) + '</div>' +
      '<div style="font-size:12.5px;color:#8A7A68;">' + esc(item.blurb) + '</div></div>';
  }).join('');
  return '<div><div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:46px;color:#3B332B;">Home</div>' +
    '<div style="font-size:15px;color:#8A7A68;margin-bottom:28px;">Every part of your academic operating system, one tap away.</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:16px;">' + tiles + '</div></div>';
}

function screenDashboard_(vm) {
  var todayClassesHtml = vm.todayClasses.length ? vm.todayClasses.map(function (c) {
    return '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #F3E3D2;">' +
      '<div style="width:8px;height:8px;border-radius:50%;background:' + c.color + ';flex-shrink:0;"></div>' +
      '<div style="font-size:13px;color:#8A7A68;width:78px;flex-shrink:0;">' + esc(c.time) + '</div>' +
      '<div style="font-size:14px;font-weight:600;">' + esc(c.module) + '</div></div>';
  }).join('') : '<div style="font-size:13px;color:#8A7A68;">No classes scheduled today.</div>';

  var todayTutorialsHtml = vm.todayTutorials.length ? vm.todayTutorials.map(function (t) {
    return '<div style="background:#A6392E;color:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;">' +
      '<div style="font-size:13px;font-weight:700;">' + esc(t.module) + '</div>' +
      '<div style="font-size:12px;opacity:.9;">' + esc(t.time) + ' · ' + esc(t.venue) + '</div></div>';
  }).join('') : '<div style="font-size:13px;color:#8A7A68;">No tutorials today.</div>';

  var studyBlockHtml;
  if (vm.todayStudyBlock) {
    var b = vm.todayStudyBlock;
    studyBlockHtml = '<div style="background:' + b.badgeColor + ';display:inline-block;color:#fff;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;margin-bottom:8px;">' + esc(b.badge.toUpperCase()) + '</div>' +
      '<div style="font-weight:700;font-size:15px;">' + esc(b.module) + '</div>' +
      '<div style="font-size:13px;color:#8A7A68;margin:2px 0 8px;">' + esc(b.topic) + '</div>' +
      '<div style="font-size:12.5px;color:#8A7A68;">' + esc(b.time) + (b.duration ? ' · ' + esc(b.duration) : '') + '</div>';
  } else {
    studyBlockHtml = '<div style="font-size:13px;color:#8A7A68;">Nothing scheduled in Study Planner for today.</div>';
  }

  var countdownsHtml = vm.countdowns.length ? vm.countdowns.map(function (d) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<div style="font-size:13.5px;font-weight:600;">' + esc(d.label) + '</div>' +
      '<div style="font-size:13px;font-weight:700;color:' + d.color + ';">' + esc(d.days) + '</div></div>';
  }).join('') : '<div style="font-size:13px;color:#8A7A68;">Nothing upcoming.</div>';

  var hoursChips = vm.hoursByModule.map(function (h) {
    return '<div style="display:flex;align-items:center;gap:6px;background:#F9EFE3;border-radius:20px;padding:5px 12px;">' +
      '<div style="width:8px;height:8px;border-radius:50%;background:' + h.color + ';"></div>' +
      '<div style="font-size:12px;font-weight:600;">' + esc(h.module) + ' · ' + h.hours + 'h</div></div>';
  }).join('');

  var moduleHealthHtml = vm.moduleHealth.map(function (m) {
    return '<div style="display:flex;align-items:center;gap:10px;margin-bottom:9px;">' +
      '<div style="width:8px;height:8px;border-radius:50%;background:' + m.color + ';flex-shrink:0;"></div>' +
      '<div style="font-size:13px;font-weight:600;flex:1;">' + esc(m.name) + '</div>' +
      '<div style="font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:' + m.statusBg + ';color:' + m.statusColor + ';">' + esc(m.status) + '</div></div>';
  }).join('');

  var phasesHtml = vm.phases.map(function (p) {
    return '<div style="flex:1;min-width:150px;text-align:center;position:relative;padding:0 6px;">' +
      '<div style="height:6px;border-radius:4px;background:' + p.barColor + ';margin-bottom:8px;"></div>' +
      '<div style="font-size:12.5px;font-weight:700;">' + esc(p.label) + '</div>' +
      '<div style="font-size:11px;color:#8A7A68;">' + esc(p.dates) + '</div></div>';
  }).join('');

  var nextAssessHtml = vm.nextAssessmentLabel
    ? '<div style="font-weight:700;font-size:15px;">' + esc(vm.nextAssessmentLabel.title) + '</div><div style="font-size:13px;color:#B24B2E;font-weight:700;">' + esc(vm.nextAssessmentLabel.when) + '</div>'
    : '<div style="font-weight:700;font-size:14px;color:#8A7A68;">Nothing scheduled</div>';

  var notesToday = (vm.notes.today || '').trim();
  var notesParking = (vm.notes.parking || '').trim();

  return '<div>' +
    '<div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:28px;">' +
    '<div><div style="font-size:12px;letter-spacing:1.5px;font-weight:700;color:#B24B2E;">' + esc(vm.todayLabelFull) + '</div>' +
    '<div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:44px;line-height:1;">Good morning.</div>' +
    '<div style="font-size:14.5px;color:#8A7A68;margin-top:4px;">' + esc(vm.calendarPhaseLabel) + '</div></div>' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:14px;padding:12px 18px;text-align:right;">' +
    '<div style="font-size:11px;color:#8A7A68;font-weight:600;">NEXT ASSESSMENT</div>' + nextAssessHtml + '</div></div>' +
    // v1.3.0 -- "What should I do next?" + any triggered Exam Focus offer,
    // both direct pass-throughs of API_v1.3.0.gs's deterministic engines
    // (see screenPriority_ for the full Academic Intelligence screen).
    (vm.nextAction ? '<div style="background:#FDF0E3;border:1px solid #E7C29C;border-radius:18px;padding:20px;margin-bottom:16px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">' +
      '<div style="flex:1;min-width:220px;"><div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:6px;">WHAT SHOULD I DO NEXT?</div>' +
      '<div style="font-weight:700;font-size:15px;">' + esc(vm.nextAction.text) + '</div></div>' +
      '<div class="ep-clickable" onclick="' + h_('setView', ['priority']) + '" style="font-size:12px;font-weight:700;color:#B24B2E;cursor:pointer;white-space:nowrap;">Why? / Academic Intelligence →</div>' +
      '</div></div>' : '') +
    (vm.examFocus.triggers.length ? '<div class="ep-clickable" onclick="' + h_('setView', ['priority']) + '" style="cursor:pointer;background:#FBEFD9;border:1px solid #E7C29C;border-radius:18px;padding:16px 20px;margin-bottom:16px;font-size:13.5px;font-weight:700;color:#8A6A2E;">' +
      'Exam Focus Mode recommended for ' + vm.examFocus.triggers.length + ' module(s) -- review →</div>' : '') +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;">' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:20px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:10px;">TODAY\'S CLASSES</div>' + todayClassesHtml + '</div>' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:20px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#A6392E;margin-bottom:10px;">TODAY\'S TUTORIALS</div>' + todayTutorialsHtml + '</div>' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:20px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:10px;">TODAY\'S STUDY BLOCK</div>' + studyBlockHtml + '</div>' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:20px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:10px;">COUNTDOWN</div><div style="display:flex;flex-direction:column;gap:8px;">' + countdownsHtml + '</div></div>' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:20px;grid-column:span 2;">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;">HOURS STUDIED (COMPLETED SESSIONS)</div>' +
    '<div style="font-size:13px;color:#8A7A68;">' + vm.totalHours + 'h logged</div></div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;">' + (hoursChips || '<div style="font-size:13px;color:#8A7A68;">No completed sessions yet.</div>') + '</div></div>' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:20px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:12px;">MODULE HEALTH</div>' + moduleHealthHtml + '</div>' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:20px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:10px;">AUTOMATION STATUS</div>' +
    '<div style="display:flex;flex-direction:column;gap:8px;">' +
    '<div style="display:flex;justify-content:space-between;"><span style="font-size:13px;">Academic Inbox</span><span style="font-size:12px;color:' + (vm.automationLastRun.enabled ? '#3F7A5C' : '#8A7A68') + ';font-weight:700;">' + (vm.automationLastRun.enabled ? '● triggers active' : '○ triggers not installed') + '</span></div>' +
    '<div style="font-size:11.5px;color:#8A7A68;">' + esc(vm.automationLastRun.inbox) + '</div>' +
    '<div style="font-size:11.5px;color:#8A7A68;">Calendar: ' + esc(vm.automationLastRun.calendar) + '</div></div>' +
    '<div class="ep-clickable" onclick="' + h_('goAutomation', []) + '" style="margin-top:12px;font-size:12.5px;font-weight:700;color:#B24B2E;cursor:pointer;">View automation details →</div></div>' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:20px;grid-column:span 2;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:10px;">QUICK NOTES</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
    '<div style="background:#F9EFE3;border-radius:12px;padding:10px 12px;font-size:13px;color:#3B332B;min-height:44px;">' + (notesToday ? esc(notesToday.slice(0, 140)) : 'No notes yet today.') + '</div>' +
    '<div style="background:#F9EFE3;border-radius:12px;padding:10px 12px;font-size:13px;color:#3B332B;min-height:44px;">' + (notesParking ? esc(notesParking.slice(0, 140)) : 'Parking lot is empty.') + '</div></div>' +
    '<div class="ep-clickable" onclick="' + h_('goNotes', []) + '" style="margin-top:10px;font-size:12.5px;font-weight:700;color:#B24B2E;cursor:pointer;">Open Notes →</div></div>' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:20px;grid-column:1/-1;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:14px;">SEMESTER TIMELINE</div>' +
    '<div style="display:flex;gap:0;overflow-x:auto;">' + phasesHtml + '</div></div>' +
    '</div></div>';
}
</script>
<script>
'use strict';

function screenCalendar_(vm) {
  var legend = vm.legendModules.map(function (l) {
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;"><div style="width:10px;height:10px;border-radius:3px;background:' + l.color + ';"></div><div style="font-size:12.5px;">' + esc(l.name) + '</div></div>';
  }).join('');
  var weekdayHeader = vm.weekdayLabels.map(function (w) {
    return '<div style="background:#DD7A56;color:#fff;text-align:center;font-size:11.5px;font-weight:700;letter-spacing:1px;padding:6px;border-radius:8px;">' + esc(w) + '</div>';
  }).join('');
  // v1.1.12 master -- Feature 9: event pill text now wraps/ellipses instead
  // of forcing the grid column wider than its share, matching the "cells
  // shrink, text wraps/ellipses" requirement.
  var days = vm.calendarDays.map(function (d) {
    var events = d.events.map(function (e) {
      return '<div class="ep-cal-event" style="background:' + e.color + ';color:#fff;">' + esc(e.label) + '</div>';
    }).join('');
    return '<div class="ep-cal-day" style="background:' + d.isToday + ';border:1px solid #F0DCC8;' + (d.dim || '') + '">' +
      '<div style="font-size:13px;font-weight:700;margin-bottom:5px;">' + esc(d.num) + '</div>' + events + '</div>';
  }).join('');
  var chips = vm.moduleFilterChips.map(function (c) {
    return '<div class="ep-clickable" onclick="' + h_('setCalendarFilter', [c.id]) + '" style="cursor:pointer;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:' + c.bg + ';border:1px solid ' + c.border + ';">' +
      '<div style="width:8px;height:8px;border-radius:50%;background:' + c.color + ';"></div><span style="font-size:12px;font-weight:600;color:' + c.textColor + ';">' + esc(c.label) + '</span></div>';
  }).join('');
  var agenda = vm.agendaItems.length ? vm.agendaItems.map(function (ag) {
    return '<div style="display:flex;align-items:center;gap:12px;background:#FDF6F0;border:1px solid #F0DCC8;border-radius:12px;padding:10px 14px;">' +
      '<div style="width:8px;height:8px;border-radius:50%;background:' + ag.color + ';flex-shrink:0;"></div>' +
      '<div style="width:70px;flex-shrink:0;font-size:12px;font-weight:700;color:#8A7A68;">' + esc(ag.dateLabel) + '</div>' +
      '<div style="flex:1;font-size:13.5px;font-weight:600;">' + esc(ag.title) + '</div>' +
      '<div style="font-size:11px;font-weight:700;color:#B24B2E;">' + esc(ag.daysLabel) + '</div></div>';
  }).join('') : '<div style="font-size:13px;color:#8A7A68;">Nothing due in the next 14 days.</div>';

  var externalBanner = vm.externalCalendarLoading
    ? '<div style="font-size:12px;color:#8A7A68;margin-bottom:10px;">Checking Google Calendar for events added outside the planner… <span class="ep-spin" style="display:inline-block;">⟳</span></div>'
    : (vm.externalCalendarReason
      ? '<div style="font-size:12px;color:#8A7A68;margin-bottom:10px;">' + esc(vm.externalCalendarReason) + '</div>'
      : '<div style="font-size:11px;color:#8A7A68;margin-bottom:10px;">📅 = added directly in Google Calendar, not by the planner. <span class="ep-clickable" style="color:#B24B2E;font-weight:700;cursor:pointer;" onclick="' + h_('loadExternalCalendarEvents_', []) + '">Refresh</span></div>');
  return '<div><div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:44px;">' + esc(vm.calendarMonthLabel) + '</div>' +
    '<div style="font-size:14px;color:#8A7A68;margin-bottom:6px;">' + esc(vm.calendarPhaseLabel) + '</div>' +
    externalBanner +
    '<div style="display:flex;gap:20px;align-items:flex-start;">' +
    '<div style="width:220px;flex-shrink:0;background:#FDF6F0;border:1px solid #F0DCC8;border-radius:16px;padding:16px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:8px;">LEGEND</div>' + legend +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin:14px 0 6px;">WEEKLY FOCUS</div>' +
    '<div style="font-size:13.5px;font-weight:600;">Filter by module below to see one module\'s deadlines only.</div>' +
    '</div>' +
    '<div style="flex:1;min-width:0;">' +
    '<div class="ep-cal-grid" style="margin-bottom:8px;">' + weekdayHeader + '</div>' +
    '<div class="ep-cal-grid">' + days + '</div>' +
    '</div></div>' +
    '<div style="margin-top:18px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:8px;">FILTER BY MODULE</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;">' + chips + '</div>' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:8px;">AGENDA — NEXT 14 DAYS</div>' +
    '<div style="display:flex;flex-direction:column;gap:8px;">' + agenda + '</div>' +
    '</div></div>';
}

function screenWeekly_(vm) {
  var legend = vm.legendModules.map(function (l) {
    return '<div style="display:flex;align-items:center;gap:6px;background:#FDF6F0;border:1px solid #F0DCC8;border-radius:20px;padding:5px 12px;"><div style="width:9px;height:9px;border-radius:3px;background:' + l.color + ';"></div><div style="font-size:12px;font-weight:600;">' + esc(l.name) + '</div></div>';
  }).join('');
  // v1.4.0 -- shared time-grid instead of each day independently stacking
  // its own sessions in order. Previously an 08:00 class and a 10:00 class
  // on different days both rendered as their column's first card, lined up
  // with each other despite being 2 hours apart -- now every day column is
  // the same height, spanning the same clock-time range, and each session
  // is positioned/sized within it by its real startMin/endMin (added to
  // buildWeekForDate_'s payload for exactly this).
  var HOUR_PX = 60; // 1 hour of real time = 60px of column height
  var allMins = [];
  vm.weekDaysForDisplay.forEach(function (day) {
    (day.sessions || []).forEach(function (s) {
      if (typeof s.startMin === 'number') allMins.push(s.startMin);
      if (typeof s.endMin === 'number') allMins.push(s.endMin);
    });
  });
  var rangeStartMin = allMins.length ? Math.floor(Math.min.apply(null, allMins) / 60) * 60 : 8 * 60;
  var rangeEndMin = allMins.length ? Math.ceil(Math.max.apply(null, allMins) / 60) * 60 : 17 * 60;
  if (rangeEndMin <= rangeStartMin) rangeEndMin = rangeStartMin + 60;
  var trackHeight = (rangeEndMin - rangeStartMin) * (HOUR_PX / 60);
  var trackVars = 'height:' + trackHeight + 'px;--ep-week-hour-px:' + HOUR_PX + 'px;';

  var hourLabels = '';
  for (var h = rangeStartMin; h <= rangeEndMin; h += 60) {
    var hh = Math.floor(h / 60);
    hourLabels += '<div class="ep-week-hourlabel" style="top:' + ((h - rangeStartMin) * (HOUR_PX / 60)) + 'px;">' + (hh < 10 ? '0' + hh : hh) + ':00</div>';
  }
  var rulerCard = '<div style="min-width:0;">' +
    '<div style="font-size:12.5px;font-weight:700;border-bottom:2px solid transparent;padding-bottom:8px;margin-bottom:10px;visibility:hidden;">·</div>' +
    '<div class="ep-week-hourcol" style="' + trackVars + '">' + hourLabels + '</div></div>';

  var days = vm.weekDaysForDisplay.map(function (day) {
    var sessions = (day.sessions || []).map(function (s) {
      var hasTiming = typeof s.startMin === 'number';
      var top = hasTiming ? (Math.max(s.startMin, rangeStartMin) - rangeStartMin) * (HOUR_PX / 60) : 0;
      var durMin = (hasTiming && typeof s.endMin === 'number' && s.endMin > s.startMin) ? (s.endMin - s.startMin) : 60;
      var height = Math.max(durMin * (HOUR_PX / 60), 34); // floor so short sessions stay readable
      return '<div class="ep-week-session-abs" style="top:' + top + 'px;height:' + height + 'px;background:' + s.color + ';color:#fff;">' +
        '<div style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(s.module) + '</div>' +
        '<div style="font-size:10.5px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + esc(s.time) + ' · ' + esc(s.type) + '</div></div>';
    }).join('') || '<div style="position:absolute;top:0;left:0;right:0;text-align:center;font-size:12px;color:#8A7A68;padding-top:8px;">No classes.</div>';
    return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:16px;padding:14px;min-width:0;">' +
      '<div style="font-size:12.5px;font-weight:700;letter-spacing:1px;color:#3B332B;border-bottom:2px solid #DD7A56;padding-bottom:8px;margin-bottom:10px;">' + esc(day.label) + '</div>' +
      '<div class="ep-week-track" style="' + trackVars + '">' + sessions + '</div></div>';
  }).join('');

  // v1.1.12 master -- Feature 10: Prev/This week/Next controls + range label
  // + previewing banner. Defaults to the real current week (weeklyIsCurrentWeek
  // true, no banner). Nothing here writes to Sheets, creates Calendar events,
  // or touches 05 Timetable Import -- api_getWeekTimetable is read-only.
  var navControls = '<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">' +
    '<div class="ep-clickable" onclick="' + h_('weeklyGoPrev', []) + '" style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;">← Previous week</div>' +
    '<div class="ep-clickable" onclick="' + h_('weeklyGoToday', []) + '" style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;">This week</div>' +
    '<div class="ep-clickable" onclick="' + h_('weeklyGoNext', []) + '" style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer;">Next week →</div>' +
    '<div style="font-size:14px;font-weight:700;color:#3B332B;">' + esc(vm.weeklyRangeLabel) + (vm.weeklyLoading ? ' <span class="ep-spin" style="display:inline-block;">⟳</span>' : '') + '</div>' +
    '</div>';
  var banner = '';
  if (!vm.weeklyIsCurrentWeek) {
    var isFuture = vm.weeklyRangeLabel && (currentMondayIso_() < (state.weeklyPreview ? state.weeklyPreview.mondayIso : currentMondayIso_()));
    banner = '<div style="background:#FBEFD9;border:1px solid #E7C7A9;border-radius:10px;padding:8px 14px;font-size:12.5px;font-weight:700;color:#8F3B23;margin-bottom:14px;">' +
      (isFuture ? 'Previewing a future week' : 'Previewing a past week') + ' — nothing here is saved, and no Calendar events are created.</div>';
  }
  var emptyBanner = vm.weeklyAllEmpty
    ? '<div style="background:#F9EFE3;border-radius:12px;padding:14px 16px;font-size:13px;color:#8A7A68;margin-bottom:14px;">No classes scheduled for this week.' +
      (vm.weeklyFirstTeachingWeekIso ? ' <span class="ep-clickable" style="color:#B24B2E;font-weight:700;cursor:pointer;" onclick="' + h_('weeklyGoToFirstTeachingWeek_', [vm.weeklyFirstTeachingWeekIso]) + '">Preview first teaching week</span>' : '') +
      '</div>'
    : '';

  return '<div><div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:44px;">Recurring Weekly Timetable</div>' +
    '<div style="font-size:14px;color:#8A7A68;margin-bottom:14px;">Source of truth: ICS timetable import · applies every week of the semester</div>' +
    navControls + banner + emptyBanner +
    '<div style="display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;">' + legend + '</div>' +
    '<div class="ep-week-scroll"><div class="ep-week-grid">' + rulerCard + days + '</div></div></div>';
}

// v1.1.12 -- feature 2 button-label sequence: Add to Inbox -> Adding… ->
// Processing… -> Filed as Assignment/Assessment (or back to Add to Inbox on
// error, since the error itself is already shown as a toast).
function inboxAddButtonLabel_() {
  var phase = state.inboxAddPhase;
  if (phase === 'adding') return 'Adding…';
  if (phase === 'processing') return 'Processing…';
  if (phase === 'filed:Assignment') return 'Filed as Assignment';
  if (phase === 'filed:Assessment') return 'Filed as Assessment';
  return 'Add to Inbox';
}

function screenInbox_(vm) {
  var f = state.inboxForm;
  var moduleOptions = '<option value="">Module…</option>' + vm.modules.map(function (m) {
    return '<option value="' + escAttr(m.name) + '"' + (f.module === m.name ? ' selected' : '') + '>' + esc(m.name) + '</option>';
  }).join('');
  var typeOptions = ['Assignment', 'Project', 'Presentation', 'Test', 'Exam', 'Other'].map(function (t) {
    return '<option value="' + t + '"' + (f.type === t ? ' selected' : '') + '>' + t + '</option>';
  }).join('');
  var prioOptions = ['Low', 'Medium', 'High'].map(function (p) {
    return '<option value="' + p + '"' + (f.priority === p ? ' selected' : '') + '>' + p + ' priority</option>';
  }).join('');
  // v1.1.12 -- feature 1 adds a Delete control per item (stable Inbox ID,
  // never row position); feature 7's statusLabel/statusBg/statusColor were
  // computed in computeViewModel above, derived from the real backend
  // filedType rather than guessed here.
  var items = vm.inboxItems.length ? vm.inboxItems.map(function (it) {
    return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;">' +
      '<div class="ep-clickable" onclick="' + h_('toggleInboxProcessed', [it.id, it.processed]) + '" style="' + (it.processed ? CHECK_ON : CHECK_OFF) + '"></div>' +
      '<div style="flex:1;"><div style="font-weight:700;font-size:14.5px;' + it.strike + '">' + esc(it.title) + '</div>' +
      '<div style="font-size:12.5px;color:#8A7A68;">' + esc(it.module) + ' · ' + esc(it.type) + ' · due ' + esc(it.due) + '</div></div>' +
      '<div style="font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:' + it.statusBg + ';color:' + it.statusColor + ';">' + esc(it.statusLabel) + '</div>' +
      '<div class="ep-clickable" onclick="' + h_('deleteInboxItem', [it.id, it.title, it.processed, it.filedType, it.filedId]) + '" style="font-size:11.5px;font-weight:700;color:#8F3B23;cursor:pointer;padding:6px 10px;">Delete</div></div>';
  }).join('') : '<div style="font-size:13px;color:#8A7A68;">Nothing captured yet.</div>';

  return '<div><div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:44px;">Academic Inbox</div>' +
    '<div style="font-size:14px;color:#8A7A68;margin-bottom:20px;">Rapid capture — file it here, it sorts itself into Assignments or Assessments.</div>' +
    '<div style="display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;">' +
    '<div style="width:360px;background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:22px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:14px;">NEW ITEM</div>' +
    '<div style="display:flex;flex-direction:column;gap:12px;">' +
    '<select onchange="' + hv_('setInboxModuleSel', []) + '" style="padding:12px;border-radius:10px;border:1px solid #E7C7A9;background:#fff;font-size:14px;font-family:\'Inter\',sans-serif;">' + moduleOptions + '</select>' +
    '<select onchange="' + hv_('setInboxTypeSel', []) + '" style="padding:12px;border-radius:10px;border:1px solid #E7C7A9;background:#fff;font-size:14px;font-family:\'Inter\',sans-serif;">' + typeOptions + '</select>' +
    '<input value="' + escAttr(f.title) + '" oninput="' + hv_('setInboxField_', ['title']) + '" placeholder="Title" style="padding:12px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '<div style="display:flex;gap:10px;">' +
    '<input type="date" value="' + escAttr(f.dueDate) + '" oninput="' + hv_('setInboxField_', ['dueDate']) + '" style="flex:1;padding:12px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '<input type="time" value="' + escAttr(f.dueTime) + '" oninput="' + hv_('setInboxField_', ['dueTime']) + '" style="flex:1;padding:12px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '</div>' +
    '<select onchange="' + hv_('setInboxPrioritySel', []) + '" style="padding:12px;border-radius:10px;border:1px solid #E7C7A9;background:#fff;font-size:14px;font-family:\'Inter\',sans-serif;">' + prioOptions + '</select>' +
    '<textarea oninput="' + hv_('setInboxField_', ['notes']) + '" placeholder="Notes" style="padding:12px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;min-height:70px;resize:vertical;">' + esc(f.notes) + '</textarea>' +
    '<div class="ep-clickable" onclick="' + h_('toggleInboxSync', []) + '" style="display:flex;align-items:center;gap:10px;cursor:pointer;">' +
    '<div style="' + (f.sendToCalendar ? CHECK_ON : CHECK_OFF) + '"></div><span style="font-size:13.5px;">Send to Calendar when processed</span></div>' +
    '<div class="ep-clickable" onclick="' + h_('addInboxItem', []) + '" style="background:#DD7A56;color:#fff;text-align:center;font-weight:700;font-size:14.5px;padding:13px;border-radius:12px;cursor:pointer;">' + inboxAddButtonLabel_() + '</div>' +
    '</div></div>' +
    '<div style="flex:1;min-width:340px;display:flex;flex-direction:column;gap:10px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;">CAPTURED ITEMS</div>' + items +
    '</div></div></div>';
}

function screenAssignments_(vm) {
  var cards = vm.assignments.length ? vm.assignments.map(function (a) {
    return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-left:5px solid ' + a.color + ';border-radius:16px;padding:18px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;">' +
      '<div style="font-size:11.5px;font-weight:700;color:' + a.color + ';margin-bottom:6px;">' + esc(a.module) + '</div>' +
      '<div class="ep-clickable" onclick="' + h_('deleteAssignment', [a.id, a.title, a.due, !!a.calendarEventId]) + '" style="font-size:11px;font-weight:700;color:#8F3B23;cursor:pointer;">Delete</div></div>' +
      '<div style="font-weight:700;font-size:15.5px;margin-bottom:10px;">' + esc(a.title) + '</div>' +
      '<div style="display:flex;justify-content:space-between;font-size:12.5px;color:#8A7A68;margin-bottom:10px;"><span>Due ' + esc(a.due) + '</span><span style="color:' + a.countdownColor + ';font-weight:700;">' + esc(a.countdown) + '</span></div>' +
      '<div style="background:#F3E3D2;border-radius:20px;height:8px;overflow:hidden;margin-bottom:10px;"><div style="background:' + a.color + ';height:8px;width:' + a.completion + '%;"></div></div>' +
      '<div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<div style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:' + a.priorityBg + ';color:' + a.priorityColor + ';">' + esc(a.priority) + '</div>' +
      '<div style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:#F3E3D2;color:#3B332B;">' + esc(a.status) + '</div></div></div>';
  }).join('') : '<div style="font-size:13px;color:#8A7A68;">No assignments yet. <span class="ep-clickable" style="color:#B24B2E;font-weight:700;cursor:pointer;" onclick="' + h_('setView', ['inbox']) + '">Add one through Academic Inbox.</span></div>';
  return '<div><div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:44px;">Assignments</div>' +
    '<div style="font-size:14px;color:#8A7A68;margin-bottom:20px;">Every assignment, project and presentation across all modules.</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;">' + cards + '</div></div>';
}

function screenAssessments_(vm) {
  var rows = vm.assessments.length ? vm.assessments.map(function (a) {
    return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:16px;padding:16px 18px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;">' +
      '<div style="width:64px;text-align:center;flex-shrink:0;"><div style="font-size:11px;color:#8A7A68;font-weight:700;">' + esc(a.month) + '</div><div style="font-size:22px;font-weight:800;">' + esc(a.day) + '</div></div>' +
      '<div style="width:64px;height:64px;border-radius:14px;background:' + a.color + ';color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;flex-shrink:0;">' + esc(a.type) + '</div>' +
      '<div style="flex:1;min-width:160px;"><div style="font-weight:700;font-size:15px;">' + esc(a.title) + '</div><div style="font-size:12.5px;color:#8A7A68;">' + esc(a.module) + ' · ' + esc(a.dateLabelFull) + ' · ' + esc(a.time) + ' · ' + esc(a.venue) + '</div></div>' +
      (a.countdown ? '<div style="font-size:11.5px;font-weight:700;color:' + a.countdownColor + ';flex-shrink:0;">' + esc(a.countdown) + '</div>' : '') +
      '<div style="font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;background:' + a.statusBg + ';color:' + a.statusColor + ';flex-shrink:0;">' + esc(a.status) + '</div>' +
      '<div class="ep-clickable" onclick="' + h_('deleteAssessment', [a.id, a.title, a.dateLabelFull, !!a.calendarEventId]) + '" style="font-size:11px;font-weight:700;color:#8F3B23;cursor:pointer;flex-shrink:0;">Delete</div></div>';
  }).join('') : '<div style="font-size:13px;color:#8A7A68;">No assessments yet. <span class="ep-clickable" style="color:#B24B2E;font-weight:700;cursor:pointer;" onclick="' + h_('setView', ['inbox']) + '">Add one through Academic Inbox.</span></div>';
  return '<div><div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:44px;">Assessments</div>' +
    '<div style="font-size:14px;color:#8A7A68;margin-bottom:20px;">A1 / A2 / A3 tests, formal exams and presentations, in date order.</div>' +
    '<div style="display:flex;flex-direction:column;gap:12px;">' + rows + '</div></div>';
}
</script>
<script>
'use strict';

function markCardFormHtml_(m) {
  var f = m.form;
  if (!m.formOpen) return '';
  var typeOptions = ['AF', 'A1', 'A2', 'A3'].map(function (t) {
    var labels = { AF: 'AF item (class/tutorial test)', A1: 'A1', A2: 'A2', A3: 'A3' };
    return '<option value="' + t + '"' + (f.type === t ? ' selected' : '') + '>' + labels[t] + '</option>';
  }).join('');
  // v1.4.1 -- Item type is locked to whichever single option matches this
  // module's "AF item type" (04 Module Rules), if set; otherwise both
  // Tutorial test / Practical are offered and a choice is required. Weight
  // is always optional, for every module -- blank behaves exactly like
  // today (plain average), see AF_Components_v1.4.1_Migration.js.
  var itemTypeBlock = '';
  if (f.type === 'AF') {
    var lockedTo = m.afItemType === 'Tutorial tests' ? 'Tutorial test' : m.afItemType === 'Practicals' ? 'Practical' : null;
    var itemTypeChoices = lockedTo ? [lockedTo] : VALID_AF_ITEM_TYPES_LIST;
    var itemTypeSelected = lockedTo || f.itemType;
