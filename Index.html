    var itemTypeOptions = (lockedTo ? [] : [['', 'Item type…']]).concat(itemTypeChoices.map(function (t) { return [t, t]; }))
      .map(function (pair) { return '<option value="' + pair[0] + '"' + (itemTypeSelected === pair[0] ? ' selected' : '') + '>' + pair[1] + '</option>'; }).join('');
    itemTypeBlock = '<div style="display:flex;gap:8px;align-items:center;">' +
      '<select ' + (lockedTo ? 'disabled' : ('onchange="' + hv_('setMarkField_', [m.code, 'itemType']) + '"')) + ' style="flex:1;padding:9px 10px;border-radius:8px;border:1px solid #E7C7A9;background:#fff;font-size:13px;font-family:\'Inter\',sans-serif;' + (lockedTo ? 'opacity:0.7;' : '') + '">' + itemTypeOptions + '</select>' +
      '<input type="number" min="0" step="0.1" value="' + escAttr(f.weight) + '" oninput="' + hv_('setMarkField_', [m.code, 'weight']) + '" placeholder="Weight (optional)" title="Optional -- how much this test counts relative to others. Blank = counts the same as an ordinary test." style="flex:1;padding:9px 10px;border-radius:8px;border:1px solid #E7C7A9;font-size:13px;font-family:\'Inter\',sans-serif;">' +
      '</div>' +
      (lockedTo ? '' : '<div style="font-size:11px;color:#8A7A68;">Set this module\'s AF item type in 04 Module Rules to lock this choice.</div>');
  }
  return '<div style="margin-top:10px;display:flex;flex-direction:column;gap:8px;">' +
    '<select onchange="' + hv_('setMarkTypeSel', [m.code]) + '" style="padding:9px 10px;border-radius:8px;border:1px solid #E7C7A9;background:#fff;font-size:13px;font-family:\'Inter\',sans-serif;">' + typeOptions + '</select>' +
    '<input value="' + escAttr(f.name) + '" oninput="' + hv_('setMarkField_', [m.code, 'name']) + '" placeholder="Assessment name (e.g. Tutorial Test 4)" style="padding:9px 10px;border-radius:8px;border:1px solid #E7C7A9;font-size:13px;font-family:\'Inter\',sans-serif;">' +
    itemTypeBlock +
    '<div style="display:flex;gap:8px;align-items:center;">' +
    '<input type="number" value="' + escAttr(f.mark) + '" oninput="' + hv_('setMarkFieldLive_', [m.code, 'mark']) + '" placeholder="Mark" style="flex:1;padding:9px 10px;border-radius:8px;border:1px solid #E7C7A9;font-size:13px;font-family:\'Inter\',sans-serif;">' +
    '<input type="number" value="' + escAttr(f.max) + '" oninput="' + hv_('setMarkFieldLive_', [m.code, 'max']) + '" placeholder="Max" style="flex:1;padding:9px 10px;border-radius:8px;border:1px solid #E7C7A9;font-size:13px;font-family:\'Inter\',sans-serif;">' +
    '<input type="date" value="' + escAttr(f.date) + '" oninput="' + hv_('setMarkField_', [m.code, 'date']) + '" style="flex:1.2;padding:9px 10px;border-radius:8px;border:1px solid #E7C7A9;font-size:13px;font-family:\'Inter\',sans-serif;">' +
    '</div>' +
    '<div id="mark-pct-' + escAttr(m.code) + '" style="font-size:12px;color:#8A7A68;text-align:right;">= ' + esc(f.pct) + '</div>' +
    '<textarea oninput="' + hv_('setMarkField_', [m.code, 'notes']) + '" placeholder="Notes (optional)" style="padding:9px 10px;border-radius:8px;border:1px solid #E7C7A9;font-size:13px;font-family:\'Inter\',sans-serif;min-height:44px;resize:vertical;">' + esc(f.notes) + '</textarea>' +
    '<div style="display:flex;gap:16px;">' +
    '<div class="ep-clickable" onclick="' + h_('toggleMarkIncludeInAf', [m.code]) + '" style="display:flex;align-items:center;gap:8px;cursor:pointer;"><div style="' + (f.includeInAf ? CHECK_ON : CHECK_OFF) + '"></div><span style="font-size:12.5px;">Included in AF</span></div>' +
    '<div class="ep-clickable" onclick="' + h_('toggleMarkWritten', [m.code]) + '" style="display:flex;align-items:center;gap:8px;cursor:pointer;"><div style="' + (f.written ? CHECK_ON : CHECK_OFF) + '"></div><span style="font-size:12.5px;">Written</span></div>' +
    '<div class="ep-clickable" onclick="' + h_('toggleMarkExcused', [m.code]) + '" style="display:flex;align-items:center;gap:8px;cursor:pointer;"><div style="' + (f.excused ? CHECK_ON : CHECK_OFF) + '"></div><span style="font-size:12.5px;">Excused/excluded</span></div>' +
    '</div>' +
    (f.error ? '<div style="font-size:12px;color:#8F3B23;background:#F7E2D8;border-radius:8px;padding:8px 10px;">' + esc(f.error) + '</div>' : '') +
    '<div style="display:flex;gap:8px;">' +
    '<div class="ep-clickable" onclick="' + h_('saveMarkEntry', [m.code, m.module, m.afItemType]) + '" style="flex:1;text-align:center;background:#DD7A56;color:#fff;font-weight:700;font-size:13px;padding:10px;border-radius:8px;cursor:pointer;' + (f.saving ? 'opacity:0.6;pointer-events:none;' : '') + '">' + (f.saving ? 'Saving…' : 'Save') + '</div>' +
    '<div class="ep-clickable" onclick="' + h_('toggleMarkForm', [m.code]) + '" style="flex:1;text-align:center;background:#F3E3D2;color:#3B332B;font-weight:600;font-size:13px;padding:10px;border-radius:8px;cursor:pointer;">Cancel</div>' +
    '</div></div>';
}

function markCardRecentAfHtml_(m) {
  if (!m.hasRecentAf) return '';
  var rows = m.recentAf.map(function (af) {
    return '<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid #F0DCC8;">' +
      '<div style="font-size:12.5px;"><div style="font-weight:600;">' + esc(af.name) + '</div>' +
      '<div style="color:#8A7A68;font-size:11px;">' + esc(af.mark) + '/' + esc(af.max) + ' · ' + esc(af.pct) + (af.date ? ' · ' + esc(af.date) : '') + '</div></div>' +
      '<span class="ep-clickable" onclick="' + h_('deleteAfEntry', [af.id, af.name]) + '" style="color:#8F3B23;cursor:pointer;font-size:12px;font-weight:700;padding:4px 8px;" title="Delete this entry">Delete</span></div>';
  }).join('');
  return '<div style="margin-top:12px;"><div style="font-size:11.5px;font-weight:700;color:#8A7A68;margin-bottom:6px;">RECENT AF ENTRIES</div>' + rows + '</div>';
}

function screenMarks_(vm) {
  var cards = vm.marksCards.map(function (m) {
    var top = '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;">' +
      '<div><div style="width:10px;height:10px;border-radius:3px;background:' + m.color + ';margin-bottom:6px;"></div><div style="font-weight:800;font-size:16px;">' + esc(m.module) + '</div></div>' +
      '<div style="font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:' + m.statusBg + ';color:' + m.statusColor + ';">' + esc(m.status) + '</div></div>';
    var body = '';
    if (m.hasData) {
      var a1Clear = m.a1Entered ? ' <span class="ep-clickable" onclick="' + h_('clearMarksTrackerPct', [m.code, 'A1', m.module]) + '" style="color:#B24B2E;cursor:pointer;font-weight:800;" title="Clear A1">✕</span>' : '';
      body = '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">' +
        '<div style="background:#F9EFE3;border-radius:10px;padding:9px;text-align:center;"><div style="font-size:10px;color:#8A7A68;font-weight:700;">AF</div><div style="font-size:17px;font-weight:800;">' + esc(m.af) + '</div></div>' +
        '<div style="background:#F9EFE3;border-radius:10px;padding:9px;text-align:center;"><div style="font-size:10px;color:#8A7A68;font-weight:700;">A1' + a1Clear + '</div><div style="font-size:17px;font-weight:800;">' + esc(m.a1) + '</div></div>' +
        '<div style="background:#F9EFE3;border-radius:10px;padding:9px;text-align:center;"><div style="font-size:10px;color:#8A7A68;font-weight:700;">PROJECTED</div><div style="font-size:17px;font-weight:800;color:#B24B2E;">' + esc(m.projected) + '</div></div></div>' +
        '<div style="font-size:12px;font-weight:700;color:#8A7A68;margin-bottom:6px;">A2 REQUIRED FOR</div>' +
        '<div style="display:flex;gap:8px;margin-bottom:10px;">' +
        '<div style="flex:1;background:#F9EFE3;border-radius:10px;padding:7px;text-align:center;"><div style="font-size:10px;color:#8A7A68;">50%</div><div style="font-size:14px;font-weight:700;">' + esc(m.req50) + '</div></div>' +
        '<div style="flex:1;background:#F9EFE3;border-radius:10px;padding:7px;text-align:center;"><div style="font-size:10px;color:#8A7A68;">60%</div><div style="font-size:14px;font-weight:700;">' + esc(m.req60) + '</div></div>' +
        '<div style="flex:1;background:#F9EFE3;border-radius:10px;padding:7px;text-align:center;"><div style="font-size:10px;color:#8A7A68;">75%</div><div style="font-size:14px;font-weight:700;">' + esc(m.req75) + '</div></div></div>' +
        '<div style="font-size:12px;color:#8A7A68;">' + esc(m.note) + '</div>';
    } else if (m.missing) {
      body = '<div style="background:#F7E2D8;border:1px dashed #DD7A56;border-radius:12px;padding:12px;font-size:12.5px;color:#8F3B23;">⚠ Assessment framework not yet supplied for this module — no calculations shown until AF/A1/A2 weightings are confirmed.</div>';
    }
    var manualAf = m.editableAf ? '<div style="margin-top:10px;"><div style="font-size:11.5px;color:#8A7A68;margin-bottom:4px;">Internal AF weighting unknown — enter combined AF directly:</div>' +
      '<input value="' + escAttr(m.manualAf) + '" oninput="' + hv_('setManualAf', []) + '" placeholder="Combined AF %" style="width:100%;box-sizing:border-box;padding:9px 10px;border-radius:8px;border:1px solid #E7C7A9;font-size:13px;font-family:\'Inter\',sans-serif;"></div>' : '';
    var formToggle = '<div class="ep-clickable" onclick="' + h_('toggleMarkForm', [m.code]) + '" style="cursor:pointer;font-size:12.5px;font-weight:700;color:#B24B2E;">' + esc(m.formToggleLabel) + '</div>';
    return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:20px;">' + top + body + manualAf +
      '<div style="margin-top:12px;border-top:1px solid #F0DCC8;padding-top:12px;">' + formToggle + markCardFormHtml_(m) + markCardRecentAfHtml_(m) + '</div></div>';
  }).join('');
  return '<div><div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:44px;">Marks Tracker</div>' +
    '<div style="font-size:14px;color:#8A7A68;margin-bottom:20px;">Projections update automatically once verified assessment rules exist. Helper formulas stay hidden.</div>' +
    '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;">' + cards + '</div></div>';
}

function screenAf_(vm) {
  var groups = vm.afGroups.map(function (g) {
    var items = g.items.length ? g.items.map(function (i) {
      return '<div style="display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid #F3E3D2;flex-wrap:wrap;">' +
        '<div style="flex:1;min-width:140px;font-size:14px;font-weight:600;">' + esc(i.name) + '</div>' +
        '<div style="font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;background:#F3E3D2;color:#3B332B;">' + esc(i.itemType) + '</div>' +
        '<div style="font-size:12px;color:#8A7A68;width:70px;" title="Weight (blank = counts the same as an ordinary test)">Weight: ' + esc(i.weight) + '</div>' +
        '<div style="font-size:12px;color:#8A7A68;width:60px;">' + esc(i.pct) + '</div>' +
        '<div style="font-size:11px;color:#8A7A68;width:80px;">' + esc(i.date) + '</div>' +
        '<div style="font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;' + (i.included ? 'background:#E4F0E9;color:#3F7A5C;' : 'background:#F7E2D8;color:#8F3B23;') + '">' + (i.included ? 'Included' : 'Not included') + '</div>' +
        '<div class="ep-clickable" onclick="' + h_('toggleAfWritten', [i.key, i.moduleName, i.name]) + '" style="' + i.writtenStyle + '"></div>' +
        '<div style="font-size:11.5px;color:#8A7A68;width:55px;">Written</div>' +
        '<div class="ep-clickable" onclick="' + h_('toggleAfExcused', [i.key, i.moduleName, i.name]) + '" style="' + i.excusedStyle + '"></div>' +
        '<div style="font-size:11.5px;color:#8A7A68;width:55px;">Excused</div></div>';
    }).join('') : '<div style="padding:14px 18px;font-size:12.5px;color:#8A7A68;">No AF entries yet for this module. <span class="ep-clickable" style="color:#B24B2E;font-weight:700;cursor:pointer;" onclick="' + h_('setView', ['marks']) + '">Add one from Marks Tracker.</span></div>';
    var itemTypeNote = g.afItemType ? '' : '<div style="font-size:11px;color:#8A7A68;margin-bottom:6px;">AF item type not yet set for this module — set it in "04 Module Rules" (Tutorial tests / Practicals).</div>';
    return '<div style="margin-bottom:20px;"><div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">' +
      '<div style="width:10px;height:10px;border-radius:3px;background:' + g.color + ';"></div><div style="font-weight:800;font-size:16px;">' + esc(g.module) + '</div></div>' +
      itemTypeNote +
      '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:14px;overflow:hidden;">' + items + '</div></div>';
  }).join('');
  return '<div><div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:44px;">AF Components</div>' +
    '<div style="font-size:14px;color:#8A7A68;margin-bottom:20px;">What makes up each module\'s assessed final (class tests, tutorial tests, practicals).</div>' + groups + '</div>';
}
</script>
<script>
'use strict';

// ============================================================
// v1.2.0 ACADEMIC WORKFLOW RELEASE -- task-based Study Planner rendering.
// Session cards now show an open-ended tickable checklist (from the new
// "21 Study Tasks" sheet) instead of a single "mark done" checkbox, plus
// inline add/edit, independent-study logging, and a weekly-suggestions
// preview/accept flow. See the dedicated v1.2.0 actions <script> block near
// the end of the page for every on*() handler referenced below.
// ============================================================
function studySessionFormHtml_(vm) {
  var f = vm.studySessionForm || {};
  var editing = !!vm.studySessionEditingId;
  var moduleOptions = '<option value="">Module…</option>' + vm.modules.map(function (m) {
    return '<option value="' + escAttr(m.name) + '"' + (f.module === m.name ? ' selected' : '') + '>' + esc(m.name) + '</option>';
  }).join('');
  var typeOptions = STUDY_TYPES_LIST.map(function (t) { return '<option value="' + t + '"' + (f.studyType === t ? ' selected' : '') + '>' + t + '</option>'; }).join('');
  var prioOptions = ['Low', 'Medium', 'High'].map(function (p) { return '<option value="' + p + '"' + (f.priority === p ? ' selected' : '') + '>' + p + ' priority</option>'; }).join('');
  return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:16px;padding:20px;margin-bottom:20px;max-width:520px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:12px;">' + (editing ? 'EDIT SESSION' : 'NEW STUDY SESSION') + '</div>' +
    '<div style="display:flex;flex-direction:column;gap:10px;">' +
    '<select onchange="' + hv_('setStudySessionField_', ['module']) + '" style="padding:11px;border-radius:10px;border:1px solid #E7C7A9;background:#fff;font-size:14px;font-family:\'Inter\',sans-serif;">' + moduleOptions + '</select>' +
    '<div style="display:flex;gap:10px;">' +
    '<input type="date" value="' + escAttr(f.date) + '" oninput="' + hv_('setStudySessionField_', ['date']) + '" style="flex:1;padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '<input type="time" value="' + escAttr(f.startTime) + '" oninput="' + hv_('setStudySessionField_', ['startTime']) + '" style="flex:1;padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '<input type="number" min="5" max="600" placeholder="Minutes" value="' + escAttr(f.duration) + '" oninput="' + hv_('setStudySessionField_', ['duration']) + '" style="flex:1;padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '</div>' +
    '<select onchange="' + hv_('setStudySessionField_', ['studyType']) + '" style="padding:11px;border-radius:10px;border:1px solid #E7C7A9;background:#fff;font-size:14px;font-family:\'Inter\',sans-serif;">' + typeOptions + '</select>' +
    '<input value="' + escAttr(f.topic) + '" oninput="' + hv_('setStudySessionField_', ['topic']) + '" placeholder="Topic" style="padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '<input value="' + escAttr(f.objective) + '" oninput="' + hv_('setStudySessionField_', ['objective']) + '" placeholder="Objective (optional)" style="padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '<select onchange="' + hv_('setStudySessionField_', ['priority']) + '" style="padding:11px;border-radius:10px;border:1px solid #E7C7A9;background:#fff;font-size:14px;font-family:\'Inter\',sans-serif;">' + prioOptions + '</select>' +
    '<textarea oninput="' + hv_('setStudySessionField_', ['notes']) + '" placeholder="Notes (optional)" style="padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;min-height:56px;resize:vertical;">' + esc(f.notes) + '</textarea>' +
    '<div class="ep-clickable" onclick="' + h_('toggleStudySessionSync_', []) + '" style="display:flex;align-items:center;gap:10px;cursor:pointer;"><div style="' + (f.syncToCalendar ? CHECK_ON : CHECK_OFF) + '"></div><span style="font-size:13.5px;">Send to Calendar</span></div>' +
    (f.error ? '<div style="font-size:12px;color:#8F3B23;background:#F7E2D8;border-radius:8px;padding:8px 10px;">' + esc(f.error) + '</div>' : '') +
    '<div style="display:flex;gap:8px;">' +
    '<div class="ep-clickable" onclick="' + h_('saveStudySession_', []) + '" style="flex:1;text-align:center;background:#DD7A56;color:#fff;font-weight:700;font-size:14px;padding:11px;border-radius:10px;cursor:pointer;">' + (f.saving ? 'Saving…' : 'Save') + '</div>' +
    '<div class="ep-clickable" onclick="' + h_('closeStudySessionForm_', []) + '" style="flex:1;text-align:center;background:#F3E3D2;color:#3B332B;font-weight:600;font-size:14px;padding:11px;border-radius:10px;cursor:pointer;">Cancel</div>' +
    '</div></div></div>';
}

function independentStudyFormHtml_(vm) {
  var f = vm.independentStudyForm || {};
  var moduleOptions = '<option value="">Module…</option>' + vm.modules.map(function (m) {
    return '<option value="' + escAttr(m.name) + '"' + (f.module === m.name ? ' selected' : '') + '>' + esc(m.name) + '</option>';
  }).join('');
  var typeOptions = TASK_TYPES_LIST.map(function (t) { return '<option value="' + t + '"' + (f.taskType === t ? ' selected' : '') + '>' + t + '</option>'; }).join('');
  return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:16px;padding:20px;margin-bottom:20px;max-width:520px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:12px;">LOG INDEPENDENT STUDY</div>' +
    '<div style="display:flex;flex-direction:column;gap:10px;">' +
    '<select onchange="' + hv_('setIndependentField_', ['module']) + '" style="padding:11px;border-radius:10px;border:1px solid #E7C7A9;background:#fff;font-size:14px;font-family:\'Inter\',sans-serif;">' + moduleOptions + '</select>' +
    '<input value="' + escAttr(f.topic) + '" oninput="' + hv_('setIndependentField_', ['topic']) + '" placeholder="Topic" style="padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '<div style="display:flex;gap:10px;">' +
    '<input type="date" value="' + escAttr(f.date) + '" oninput="' + hv_('setIndependentField_', ['date']) + '" style="flex:1;padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '<input type="number" min="1" max="600" placeholder="Minutes" value="' + escAttr(f.duration) + '" oninput="' + hv_('setIndependentField_', ['duration']) + '" style="flex:1;padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '</div>' +
    '<select onchange="' + hv_('setIndependentField_', ['taskType']) + '" style="padding:11px;border-radius:10px;border:1px solid #E7C7A9;background:#fff;font-size:14px;font-family:\'Inter\',sans-serif;">' + typeOptions + '</select>' +
    '<input value="' + escAttr(f.activityName) + '" oninput="' + hv_('setIndependentField_', ['activityName']) + '" placeholder="Activity or resource name (optional)" style="padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '<div style="display:flex;gap:10px;">' +
    '<input type="number" min="0" max="100" placeholder="Score % (optional)" value="' + escAttr(f.score) + '" oninput="' + hv_('setIndependentField_', ['score']) + '" style="flex:1;padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '<input type="number" min="0" max="100" placeholder="Confidence % (optional)" value="' + escAttr(f.confidence) + '" oninput="' + hv_('setIndependentField_', ['confidence']) + '" style="flex:1;padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;">' +
    '</div>' +
    '<textarea oninput="' + hv_('setIndependentField_', ['notes']) + '" placeholder="Notes (optional)" style="padding:11px;border-radius:10px;border:1px solid #E7C7A9;font-size:14px;font-family:\'Inter\',sans-serif;min-height:56px;resize:vertical;">' + esc(f.notes) + '</textarea>' +
    (f.error ? '<div style="font-size:12px;color:#8F3B23;background:#F7E2D8;border-radius:8px;padding:8px 10px;">' + esc(f.error) + '</div>' : '') +
    '<div style="display:flex;gap:8px;">' +
    '<div class="ep-clickable" onclick="' + h_('saveIndependentStudy_', []) + '" style="flex:1;text-align:center;background:#DD7A56;color:#fff;font-weight:700;font-size:14px;padding:11px;border-radius:10px;cursor:pointer;">' + (f.saving ? 'Saving…' : 'Log it') + '</div>' +
    '<div class="ep-clickable" onclick="' + h_('closeIndependentStudyForm_', []) + '" style="flex:1;text-align:center;background:#F3E3D2;color:#3B332B;font-weight:600;font-size:14px;padding:11px;border-radius:10px;cursor:pointer;">Cancel</div>' +
    '</div></div></div>';
}

function suggestionsPreviewHtml_(vm) {
  var p = vm.suggestionsPreview;
  if (!p) return '';
  if (!p.suggestions.length) {
    return '<div style="background:#F9EFE3;border-radius:12px;padding:14px 16px;font-size:13px;color:#8A7A68;margin-bottom:20px;">' + esc(p.emptyReason || 'No free slots found for that week — fully booked by classes, or already covered by existing sessions.') + ' <span class="ep-clickable" style="color:#B24B2E;font-weight:700;cursor:pointer;" onclick="' + h_('closeSuggestions_', []) + '">Dismiss</span></div>';
  }
  var moduleOptionsFor = function (chosen) {
    return '<option value="">Module…</option>' + vm.modules.map(function (m) {
      return '<option value="' + escAttr(m.name) + '"' + (chosen === m.name ? ' selected' : '') + '>' + esc(m.name) + '</option>';
    }).join('');
  };
  var rows = p.suggestions.map(function (s, i) {
    if (s._rejected) return '';
    // v1.3.0 -- s.reason is the priority engine's explanation for why THIS
    // module/type/topic was proposed for this slot (spec §8: transparency).
    // Absent on legacy-shaped items (e.g. after the module is hand-edited),
    // in which case nothing is shown -- never a fabricated reason.
    return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">' +
      '<div style="font-size:12.5px;font-weight:700;width:150px;flex-shrink:0;">' + esc(formatLocalDateOnly_(s.date)) + ' · ' + esc(s.startTimeIso) + '</div>' +
      '<select onchange="' + hv_('setSuggestionField_', [i, 'module']) + '" style="padding:8px;border-radius:8px;border:1px solid #E7C7A9;background:#fff;font-size:13px;font-family:\'Inter\',sans-serif;">' + moduleOptionsFor(s.module) + '</select>' +
      '<input value="' + escAttr(s.topic || '') + '" oninput="' + hv_('setSuggestionField_', [i, 'topic']) + '" placeholder="Topic" style="padding:8px;border-radius:8px;border:1px solid #E7C7A9;font-size:13px;font-family:\'Inter\',sans-serif;flex:1;min-width:110px;">' +
      '<div style="font-size:11px;color:#8A7A68;flex-shrink:0;">' + esc(s.studyType) + ' · ' + s.duration + 'm</div>' +
      '<div class="ep-clickable" onclick="' + h_('acceptOneSuggestion_', [i]) + '" style="background:#DD7A56;color:#fff;font-weight:700;font-size:12px;padding:8px 12px;border-radius:8px;cursor:pointer;flex-shrink:0;">Accept</div>' +
      '<div class="ep-clickable" onclick="' + h_('rejectOneSuggestion_', [i]) + '" style="background:#F3E3D2;color:#3B332B;font-weight:600;font-size:12px;padding:8px 12px;border-radius:8px;cursor:pointer;flex-shrink:0;">Reject</div>' +
      (s.reason ? '<div style="flex-basis:100%;font-size:11px;color:#8A7A68;">Why: ' + esc(s.reason) + '</div>' : '') +
      '</div>';
  }).join('');
  var friday = weeklyShiftDays_(p.mondayIso, 4);
  return '<div style="margin-bottom:20px;">' +
    '<div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:8px;">SUGGESTED SESSIONS FOR ' + esc(formatWeekRangeLabel_(p.mondayIso, friday)) + ' — nothing saved until you Accept</div>' +
    rows +
    '<div class="ep-clickable" onclick="' + h_('closeSuggestions_', []) + '" style="font-size:12px;font-weight:700;color:#8A7A68;cursor:pointer;margin-top:4px;">Dismiss remaining</div>' +
    '</div>';
}

function studySessionCompletionFormHtml_(s) {
  var f = state.completeSessionForm || { status: 'Completed', actualDuration: s.durationRaw || '', confidenceAfter: '', note: '' };
  var statusOptions = SESSION_STATUSES_LIST.filter(function (x) { return x !== 'Planned'; }).map(function (t) {
    return '<option value="' + t + '"' + (f.status === t ? ' selected' : '') + '>' + t + '</option>';
  }).join('');
  return '<div style="background:#F9EFE3;border-radius:12px;padding:14px;margin-top:10px;display:flex;flex-direction:column;gap:8px;">' +
    '<div style="font-size:10.5px;font-weight:700;letter-spacing:1px;color:#B24B2E;">CLOSE OUT THIS SESSION</div>' +
    '<select onchange="' + hv_('setCompleteField_', ['status']) + '" style="padding:9px;border-radius:8px;border:1px solid #E7C7A9;background:#fff;font-size:13px;font-family:\'Inter\',sans-serif;">' + statusOptions + '</select>' +
    '<div style="display:flex;gap:8px;">' +
    '<input type="number" min="0" max="600" placeholder="Actual minutes" value="' + escAttr(f.actualDuration) + '" oninput="' + hv_('setCompleteField_', ['actualDuration']) + '" style="flex:1;padding:9px;border-radius:8px;border:1px solid #E7C7A9;font-size:13px;font-family:\'Inter\',sans-serif;">' +
    '<input type="number" min="0" max="100" placeholder="Confidence %" value="' + escAttr(f.confidenceAfter) + '" oninput="' + hv_('setCompleteField_', ['confidenceAfter']) + '" style="flex:1;padding:9px;border-radius:8px;border:1px solid #E7C7A9;font-size:13px;font-family:\'Inter\',sans-serif;">' +
    '</div>' +
    '<input value="' + escAttr(f.note) + '" oninput="' + hv_('setCompleteField_', ['note']) + '" placeholder="Note (optional)" style="padding:9px;border-radius:8px;border:1px solid #E7C7A9;font-size:13px;font-family:\'Inter\',sans-serif;">' +
    '<div style="display:flex;gap:8px;">' +
    '<div class="ep-clickable" onclick="' + h_('saveCompleteSession_', [s.id]) + '" style="flex:1;text-align:center;background:#DD7A56;color:#fff;font-weight:700;font-size:13px;padding:9px;border-radius:8px;cursor:pointer;">Save</div>' +
    '<div class="ep-clickable" onclick="' + h_('closeCompleteSession_', []) + '" style="flex:1;text-align:center;background:#F3E3D2;color:#3B332B;font-weight:600;font-size:13px;padding:9px;border-radius:8px;cursor:pointer;">Cancel</div>' +
    '</div></div>';
}

function studySessionCardHtml_(s) {
  var tasks = s.tasks.map(function (t) {
    return '<div style="display:flex;align-items:center;gap:8px;padding:5px 0;">' +
      '<div class="ep-clickable" onclick="' + h_('toggleStudyTaskUi_', [t.id, !t.completed]) + '" style="' + t.checkStyle + '"></div>' +
      '<div style="flex:1;font-size:12.5px;' + t.strike + '">' + esc(t.text) + '</div>' +
      '<div class="ep-clickable" onclick="' + h_('deleteStudyTaskUi_', [t.id, t.text]) + '" style="font-size:10.5px;font-weight:700;color:#8F3B23;cursor:pointer;">✕</div>' +
      '</div>';
  }).join('') || '<div style="font-size:12px;color:#8A7A68;">No tasks yet.</div>';
  return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:16px;padding:18px;' + s.doneOpacity + '">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:6px;">' +
    '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">' +
    '<div style="background:' + s.badgeColor + ';color:#fff;font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;">' + esc(s.block) + '</div>' +
    '<div style="font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:20px;background:' + s.statusBg + ';color:' + s.statusColor + ';">' + esc(s.status) + '</div>' +
    (s.origin === 'Independent' ? '<div style="font-size:10.5px;font-weight:700;color:#8A7A68;">Independent</div>' : '') +
    '</div>' +
    '<div style="display:flex;align-items:center;gap:10px;">' +
    '<div class="ep-clickable" onclick="' + h_('openStudySessionForm_', [s.id]) + '" style="font-size:11px;font-weight:700;color:#B24B2E;cursor:pointer;">Edit</div>' +
    '<div class="ep-clickable" onclick="' + h_('toggleCompleteSessionUi_', [s.id]) + '" style="font-size:11px;font-weight:700;color:#3F7A5C;cursor:pointer;">' + (s.isCompleting ? 'Close' : 'Complete') + '</div>' +
    '<div class="ep-clickable" onclick="' + h_('deleteStudySession', [s.id, s.moduleShort + ' — ' + s.topic, (s.dateLabel || '') + ' ' + (s.time || ''), !!s.calendarEventId]) + '" style="font-size:11px;font-weight:700;color:#8F3B23;cursor:pointer;">Delete</div>' +
    '</div></div>' +
    '<div style="font-weight:700;font-size:15px;' + s.strike + '">' + esc(s.moduleShort) + ' — ' + esc(s.topic) + '</div>' +
    (s.objective ? '<div style="font-size:13px;color:#8A7A68;margin:6px 0;">' + esc(s.objective) + '</div>' : '') +
    '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:#8A7A68;margin-bottom:10px;"><span>' + esc(s.dateLabel) + (s.time ? ' · ' + esc(s.time) : '') + '</span><span>' + esc(s.duration) + '</span></div>' +
    '<div style="border-top:1px solid #F0DCC8;padding-top:10px;">' +
    '<div style="font-size:10.5px;font-weight:700;color:#8A7A68;margin-bottom:4px;">' + esc(s.taskCountLabel) + '</div>' +
    tasks +
    '<div style="display:flex;gap:6px;margin-top:6px;">' +
    '<input value="' + escAttr(s.newTaskText) + '" oninput="' + hv_('setNewTaskText_', [s.id]) + '" placeholder="Add a task…" style="flex:1;padding:7px 9px;border-radius:8px;border:1px solid #E7C7A9;font-size:12.5px;font-family:\'Inter\',sans-serif;">' +
    '<div class="ep-clickable" onclick="' + h_('addStudyTaskUi_', [s.id]) + '" style="background:#F3E3D2;color:#3B332B;font-weight:700;font-size:12px;padding:7px 10px;border-radius:8px;cursor:pointer;">+</div>' +
    '</div></div>' +
    (s.isCompleting ? studySessionCompletionFormHtml_(s) : '') +
    '</div>';
}

// v1.4.2 -- quick "which modules?" checklist, shown collapsed by default
// above the Generate controls. Include is still a saved setting
// (quickToggleStudyInclude_, unchanged). Priority (v1.4.3) is NOT saved --
// state.studyGenPriorityOverrides is plain session state, sent alongside
// the week offset only when you click Generate (see doGenerateSuggestions_
// / api_generateStudySuggestions), never written to any sheet. This
// replaces v1.4.2's persistent "Manual priority override" column, which
// kept silently overriding the computed category indefinitely once set.
function studyIncludeChecklistHtml_(vm) {
  var priorityByCode = {};
  (vm.priorities || []).forEach(function (p) { priorityByCode[p.code] = p; });
  var rows = vm.modules.filter(function (m) { return m.active; }).map(function (m) {
    var p = priorityByCode[m.code];
    var hasComputed = p && p.category !== 'Rules Incomplete' && p.category !== 'Insufficient data';
    var sessionOverride = state.studyGenPriorityOverrides[m.code] || '';

      '</div>';
  }).join('');

// v1.3.1 2nd correction pass: replaces the old blended "assessment
// contribution" table (which assumed a single AF+A1+A2+A3=100% weighting)
// with a per-assessment status/mark table plus editable status controls.
// AF has no independent written/not-written concept in the Faculty model
// (it's continuous assessment feeding every route), so it's shown mark-only;
// A1/A2/A3 each get an explicit status dropdown -- spec correction: "a blank
// mark must not automatically mean 'not written'", so the dropdown always
// defaults to whatever mi_statusOf_ resolved server-side, never blank/guessed
// client-side.
var MI_ASSESSMENT_STATUS_OPTIONS = ['', 'written', 'not written', 'excused', 'deferred'];
function assessmentStatusRowHtml_(mi, key, label, mark, weight, status, editable) {
  var code = mi.code;
  var markCell = (typeof mark === 'number') ? (mark + '%') : '<span style="color:#8A7A68;">not recorded</span>';
  var weightCell = (typeof weight === 'number') ? (weight + '%') : '<span style="color:#8A7A68;">—</span>';
  if (editable === false) {
    return '<tr><td style="padding:5px 8px 5px 0;font-weight:700;">' + esc(label) + '</td>' +
      '<td style="padding:5px 8px;">' + weightCell + '</td>' +
      '<td style="padding:5px 8px;">' + markCell + '</td>' +
      '<td style="padding:5px 8px;color:#8A7A68;">n/a</td><td style="padding:5px 0;color:#8A7A68;">—</td></tr>';
  }
  var typed = (state.assessmentStatusInput[code] || {})[key];
  var current = (typed !== undefined) ? typed : (status && status !== 'unknown' ? status : '');
  var saving = !!(state.assessmentStatusSaving[code] || {})[key];
  var statusColor = status === 'written' ? '#3F7A5C' : (status === 'not_written' ? '#8F3B23' : (status === 'excused' || status === 'deferred') ? '#B58821' : '#8A7A68');
  var options = MI_ASSESSMENT_STATUS_OPTIONS.map(function (o) {
    var lbl = o === '' ? '(infer from mark)' : o.charAt(0).toUpperCase() + o.slice(1);
    return '<option value="' + escAttr(o) + '"' + (o === current ? ' selected' : '') + '>' + esc(lbl) + '</option>';
  }).join('');
  return '<tr><td style="padding:5px 8px 5px 0;font-weight:700;">' + esc(label) + '</td>' +
    '<td style="padding:5px 8px;">' + weightCell + '</td>' +
    '<td style="padding:5px 8px;">' + markCell + '</td>' +
    '<td style="padding:5px 8px;"><span style="font-weight:700;color:' + statusColor + ';">' + esc(mi_describeStatusLabel_(status)) + '</span></td>' +
    '<td style="padding:5px 0;"><div style="display:flex;gap:6px;align-items:center;">' +
    '<select onchange="' + hv_('setAssessmentStatusInput_', [code, key]) + '" style="padding:5px 6px;border-radius:6px;border:1px solid #E7C7A9;font-size:12px;font-family:\'Inter\',sans-serif;">' + options + '</select>' +
    '<div class="ep-clickable" onclick="' + h_('saveAssessmentStatus_', [mi.name, code, key]) + '" style="background:#F3E3D2;color:#3B332B;font-weight:700;font-size:11.5px;padding:5px 10px;border-radius:6px;cursor:pointer;">' + (saving ? 'Saving…' : 'Set') + '</div>' +
    '</div></td></tr>';
}
function mi_describeStatusLabel_(status) {
  return status === 'written' ? 'Written' : status === 'not_written' ? 'Not written'
    : status === 'excused' ? 'Excused' : status === 'deferred' ? 'Deferred' : 'Unknown';
}
function dcaMarkInputHtml_(mi) {
  var code = mi.code;
  var typed = state.dcaMarkInput[code];
  var val = (typed !== undefined) ? typed : (typeof mi.dcaMarkOnFile === 'number' ? mi.dcaMarkOnFile : '');
  var saving = !!state.dcaMarkSaving[code];
  return '<div style="margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +
    '<label style="font-size:11.5px;color:#8A7A68;font-weight:700;">DCA mark (%)</label>' +
    '<input type="number" min="0" max="100" step="0.1" placeholder="e.g. 58.0" value="' + escAttr(val) + '" oninput="' + hv_('setDcaMarkInput_', [code]) + '" style="width:110px;padding:6px 8px;border-radius:8px;border:1px solid #E7C7A9;font-size:12.5px;font-family:\'Inter\',sans-serif;">' +
    '<div class="ep-clickable" onclick="' + h_('saveDcaMark_', [mi.name, code]) + '" style="background:#F3E3D2;color:#3B332B;font-weight:700;font-size:11.5px;padding:6px 12px;border-radius:6px;cursor:pointer;">' + (saving ? 'Saving…' : 'Save') + '</div>' +
    (typeof mi.dcaMarkOnFile === 'number' ? '<div class="ep-clickable" onclick="' + h_('saveDcaMark_', [mi.name, code, true]) + '" style="background:#F3E3D2;color:#3B332B;font-weight:700;font-size:11.5px;padding:6px 12px;border-radius:6px;cursor:pointer;">Clear</div>' : '') +
    '</div>';
}
function assessmentStatusTableHtml_(mi) {
  var v = mi.values || {};
  var w = (mi.weights && mi.weights.complete) ? mi.weights : {};
  var rows = assessmentStatusRowHtml_(mi, 'af', 'AF', v.af, w.af, null, false) +

    assessmentStatusRowHtml_(mi, 'a2', 'A2', v.a2, w.a2, mi.a2Status) +

    : !mi.a3Verified ? 'A3 weight not verified' : 'Verified';
  var rulesColor = rulesStatus === 'Verified' ? '#3F7A5C' : '#B58821';
  return '<div style="margin-top:4px;">' +
    '<table style="width:100%;border-collapse:collapse;font-size:12px;">' +
    '<tr style="color:#8A7A68;font-size:10.5px;text-align:left;"><th style="font-weight:700;padding:0 8px 4px 0;">Assessment</th><th style="font-weight:700;padding:0 8px 4px;">Weight</th><th style="font-weight:700;padding:0 8px 4px;">Mark</th><th style="font-weight:700;padding:0 8px 4px;">Status</th><th style="font-weight:700;padding:0;">Set status</th></tr>' +
    rows + '</table>' +
    '<div style="margin-top:8px;font-size:11px;"><span style="color:#8A7A68;">Rules status: </span><span style="font-weight:700;color:' + rulesColor + ';">' + esc(rulesStatus) + '</span>' +
    (mi.subminimumMode ? ' <span style="color:#8A7A68;">· A2/A3 subminimum mode: </span><span style="font-weight:700;">' + esc(mi.subminimumMode) + '</span>' : ' <span style="color:#8A7A68;">· A2/A3 subminimum mode not configured (Rule 1 not evaluated)</span>') +

}

function a2InferencePanelHtml_(inferredA2) {
  if (!inferredA2 || inferredA2.status !== 'estimated') return '';
  var confColor = inferredA2.confidence === 'High' ? '#3F7A5C' : (inferredA2.confidence === 'Medium' ? '#B58821' : '#8F3B23');
  // v1.3.1: the solve can produce a [low, high] interval, not just a single
  // point estimate, when AF/A1/the published figure are themselves rounded
  // (spec §2: "support intervals when rounding creates multiple solutions").
  var interval = inferredA2.interval;
  var intervalHtml = (interval && (interval.high - interval.low) > 0.05)
    ? '<div><div style="font-size:10.5px;color:#8A7A68;">Possible range</div><div style="font-weight:700;">' + interval.low + '% – ' + interval.high + '%</div></div>'
    : '';
  var verifiedHtml = '<div><div style="font-size:10.5px;color:#8A7A68;">Verified by recalculation</div><div style="font-weight:700;color:' + (inferredA2.verified ? '#3F7A5C' : '#8F3B23') + ';">' + (inferredA2.verified ? 'Yes' : 'No') + '</div></div>';
  return '<div style="background:#FFF9EF;border:1px dashed #E7C29C;border-radius:12px;padding:12px 14px;margin-top:10px;">' +
    '<div style="font-size:10.5px;font-weight:700;letter-spacing:0.5px;color:#B58821;margin-bottom:4px;">ESTIMATED A2 (not official — inferred, never published by the module)</div>' +
    '<div style="display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;">' +
    '<div><div style="font-size:22px;font-weight:700;">' + inferredA2.estimate + '%</div></div>' +
    '<div><div style="font-size:10.5px;color:#8A7A68;">Confidence</div><div style="font-weight:700;color:' + confColor + ';">' + esc(inferredA2.confidence) + '</div></div>' +
    verifiedHtml + intervalHtml +
    '</div>' +
    '<div style="font-size:11.5px;color:#8A7A68;margin-top:4px;">Calculated from verified module rules and this module\'s own "Published Final (Before A3)" entry. The tolerance used, every weighting figure, and the full recalculation are listed below.</div>' +
    reasonsListHtml_(inferredA2.reasons) + '</div>';
}

// v1.3.1 2nd correction pass: the required-A3 calculator must show THREE
// separate figures, never silently merged into one "corrected" number --
// (a) mathematically required A3 (raw arithmetic), (b) regulation-valid
// required A3 (same figure, but only shown as the "answer" if it would
// actually survive Faculty Override Rules 1/2), (c) impossible-due-to-cap
// (the raw arithmetic works, but no Faculty Override Rule allows the target
// to be reached this way at all). r.status here mirrors
// mi_computeRequiredA3ForRoute_'s exact status vocabulary server-side.
function a3RouteRowHtml_(r, showBestLabel) {
  var mathLine = (typeof r.mathematicallyRequiredA3 === 'number')
    ? ('<div style="font-size:12.5px;"><span style="color:#8A7A68;">Mathematically required A3:</span> <span style="font-weight:700;">' + r.mathematicallyRequiredA3 + '%</span></div>')
    : '';
  var regLine;
  if (r.status === 'weight_unverified' || r.status === 'a3_unverified') {
    regLine = '<div style="font-size:13px;color:#8F3B23;font-weight:700;">A3 rules incomplete — required-A3 and FM2/FM3 calculations unavailable.</div>';
  } else if (r.status === 'not_written') {
    regLine = '<div style="font-size:13px;color:#8A7A68;">Not yet computable — a required component has not been written.</div>';
  } else if (r.status === 'insufficient_data') {
    regLine = '<div style="font-size:13px;color:#8A7A68;">Insufficient data.</div>';
  } else if (r.status === 'already_secured') {
    regLine = '<div style="font-size:13px;color:#3F7A5C;font-weight:700;">Already secured (0% needed).</div>';
  } else if (r.status === 'impossible') {
    regLine = '<div style="font-size:13px;color:#8F3B23;font-weight:700;">Not mathematically possible (would require over 100%).</div>';
  } else if (r.status === 'impossible_due_to_cap') {
    regLine = '<div style="font-size:13px;color:#8F3B23;font-weight:700;">Impossible because of a Faculty Override Rule cap — the raw arithmetic reaches the target, but a 45% or 50% cap would apply before the target could ever be the Official Final Mark.</div>';
  } else {
    regLine = '<div style="font-size:13px;"><span style="color:#8A7A68;">Regulation-valid required A3:</span> <span style="font-weight:700;">' + r.regulationValidRequiredA3 + '%</span></div>';
  }
  // v1.3.1: "Best route" / "Alternative route" / "Invalid route" (spec §5)
  // -- isInvalid/isAlternative are computed server-side in mi_computeA3Recovery_.
  var tag = '';
  if (showBestLabel) {
    if (r.isBest) tag = ' <span style="font-size:10px;font-weight:700;color:#3F7A5C;">(Best route)</span>';
    else if (r.isAlternative) tag = ' <span style="font-size:10px;font-weight:700;color:#8A7A68;">(Alternative route)</span>';
    else tag = ' <span style="font-size:10px;font-weight:700;color:#8F3B23;">(Invalid route)</span>';
  }
  return '<div style="padding:6px 0;border-top:1px solid #F0DCC8;">' +
    '<div style="font-size:12px;color:#8A7A68;">' + esc(r.route) + tag + '</div>' +
    mathLine + regLine +
    reasonsListHtml_(r.reasons) +
    (r.warnings && r.warnings.length ? '<ul style="margin:4px 0 0 0;padding-left:18px;font-size:12px;color:#B58821;font-weight:700;">' + r.warnings.map(function (w) { return '<li style="margin-bottom:2px;">' + esc(w) + '</li>'; }).join('') + '</ul>' : '') +
    '</div>';
}

function a3TargetBlockHtml_(t) {
  var showBestLabel = t.routes.length > 1;
  return '<div style="margin-top:8px;">' +
    '<div style="font-size:12.5px;font-weight:700;">' + esc(t.label) + ' <span style="color:#8A7A68;font-weight:400;">(' + t.targetMark + '% target)</span></div>' +
    t.routes.map(function (r) { return a3RouteRowHtml_(r, showBestLabel); }).join('') + '</div>';
}

function a3RecoveryCalculatorHtml_(mi) {

    '<input type="number" min="0" max="100" step="0.5" placeholder="Custom target %" value="' + escAttr(customVal) + '" oninput="' + hv_('setA3CustomTargetInput_', [code]) + '" style="width:130px;padding:7px 10px;border-radius:8px;border:1px solid #E7C7A9;font-size:12.5px;font-family:\'Inter\',sans-serif;">' +
    '<div class="ep-clickable" onclick="' + h_('computeCustomA3Recovery_', [mi.name, code]) + '" style="background:#F3E3D2;color:#3B332B;font-weight:700;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer;">' + (customLoading ? 'Calculating…' : 'Calculate') + '</div>' +

    '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">' +

    '<div class="ep-clickable" onclick="' + h_('savePublishedFinalAfter_', [mi.name, code]) + '" style="background:#DD7A56;color:#fff;font-weight:700;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer;">' + (saving ? 'Saving…' : 'Save') + '</div>' +
    (typeof mi.publishedFinalAfterA3 === 'number' ? '<div class="ep-clickable" onclick="' + h_('savePublishedFinalAfter_', [mi.name, code, true]) + '" style="background:#F3E3D2;color:#3B332B;font-weight:700;font-size:12px;padding:7px 14px;border-radius:8px;cursor:pointer;">Clear</div>' : '') +
    '</div></div>';
}

// v1.3.1 2nd correction pass: replaces facultyRoutesHtml_/fmRouteLineHtml_.
// Displays the full ordered pipeline result: MTD, FM1/FM2/FM3, Raw FMp
// (highest valid route BEFORE caps) and the Official Final Mark (AFTER DCA
// and Faculty overrides) shown as two clearly separate figures -- never
// conflated -- plus winning route, DCA substitution audit, and which
// override (if any) was applied. `pipeline` is either
// mi.{mtd,fm1,fm2,fm3,rawFmp,officialFinalMark,winningRoute,dcaApplied,
// dcaInfo,capsApplied} directly, or a What-If scenario's `fmpAndOfficial`
// (same shape, minus mtd).
function fmRouteLineHtml_(label, formula, fm) {
  var val = (fm && typeof fm.value === 'number') ? (fm.value + '%') : '<span style="color:#8A7A68;">not yet computable</span>';
  var reason = (fm && fm.reasons && fm.reasons[0]) ? '<div style="font-size:11px;color:#8A7A68;margin-top:1px;">' + esc(fm.reasons[0]) + '</div>' : '';
  return '<div style="font-size:12.5px;padding:4px 0;border-top:1px solid #F0DCC8;"><span style="font-weight:700;">' + esc(label) + '</span> <span style="color:#8A7A68;">(' + esc(formula) + ')</span>: ' + val + reason + '</div>';
}
function pipelineHtml_(mi, pipeline, mtd) {
  if (!pipeline) return '';
  var mtdHtml = mtd
    ? '<div style="font-size:12.5px;padding:4px 0;"><span style="font-weight:700;">MTD</span> <span style="color:#8A7A68;">(AF+A1 only)</span>: ' + (typeof mtd.value === 'number' ? mtd.value + '%' : '<span style="color:#8A7A68;">not yet computable</span>') + '<div style="font-size:11px;color:#8A7A68;margin-top:1px;">' + esc(mtd.reasons[0]) + '</div></div>'
    : '';
  var rawFmpHtml = (typeof pipeline.rawFmp === 'number')
    ? '<span style="font-size:20px;font-weight:700;">' + pipeline.rawFmp + '%</span>' + (pipeline.winningRoute ? ' <span style="font-size:11.5px;color:#8A7A68;">via ' + esc(pipeline.winningRoute) + '</span>' : '')
    : '<span style="font-size:13px;color:#8A7A68;">Not yet computable</span>';
  var officialHtml = (typeof pipeline.officialFinalMark === 'number')
    ? '<span style="font-size:20px;font-weight:700;">' + pipeline.officialFinalMark + '%</span>'
    : '<span style="font-size:13px;color:#8A7A68;">Not yet computable</span>';
  var capsHtml = (pipeline.capsApplied && pipeline.capsApplied.length)
    ? '<div style="margin-top:4px;">' + pipeline.capsApplied.map(function (c) {
        return '<span style="font-size:10.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:#F8D7DA;color:#8F3B23;margin-right:6px;">' + esc(c.rule) + ' cap applied (' + c.cap + '%, down from ' + c.rawFmp + '%)</span>';
      }).join('') + '</div>'
    : '<div style="margin-top:4px;font-size:11px;color:#8A7A68;">Override applied: none</div>';
  var dcaHtml = pipeline.dcaApplied && pipeline.dcaInfo
    ? '<div style="font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:10px;background:#FBEFD9;color:#B58821;display:inline-block;margin-top:6px;">DCA substitution: ' + esc(pipeline.dcaInfo.replacedComponent.toUpperCase()) + ' ' + pipeline.dcaInfo.originalValue + '% → ' + pipeline.dcaInfo.dcaMark + '% (original preserved for audit)</div>'
    : '';
  return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:12px;padding:12px 14px;margin-top:10px;">' +
    '<div style="font-size:10.5px;font-weight:700;letter-spacing:0.5px;color:#8A7A68;margin-bottom:6px;">CALCULATION PIPELINE — MTD → DCA → FM1/FM2/FM3 → Raw FMp → Official Final Mark</div>' +
    mtdHtml +
    fmRouteLineHtml_('FM1', 'AF+A1+A2', pipeline.fm1) + fmRouteLineHtml_('FM2', 'AF+A1+A3', pipeline.fm2) + fmRouteLineHtml_('FM3', 'AF+A2+A3', pipeline.fm3) +
    '<div style="margin-top:10px;display:flex;gap:24px;flex-wrap:wrap;">' +
    '<div><div style="font-size:10.5px;color:#8A7A68;">Raw FMp (before overrides)</div>' + rawFmpHtml + '</div>' +
    '<div><div style="font-size:10.5px;color:#8A7A68;">Official Final Mark (after DCA &amp; overrides)</div>' + officialHtml + '</div>' +
    '</div>' +
    capsHtml + dcaHtml +
    (pipeline.warnings && pipeline.warnings.length ? '<ul style="margin:6px 0 0 0;padding-left:18px;font-size:12px;color:#B58821;font-weight:700;">' + pipeline.warnings.map(function (w) { return '<li style="margin-bottom:2px;">' + esc(w) + '</li>'; }).join('') + '</ul>' : '') +
    reasonsListHtml_(pipeline.reasons) + '</div>';
}

function whatIfResultHtml_(mi, code) {
  var res = state.whatIfResult[code];
  if (!res) return '';
  if (res.status !== 'ok') return '<div style="font-size:12px;color:#8A7A68;margin-top:8px;">' + reasonsListHtml_(res.reasons) + '</div>';
  var routeHtml = res.route ? '<div style="font-size:11.5px;color:#8A7A68;margin-top:4px;">Matched route: <span style="font-weight:700;">' + esc(res.route) + '</span></div>' : '';
  var targetsHtml = res.targets.map(function (t) {
    var line;
    if (t.status === 'computed') line = '<span style="font-weight:700;">' + esc(res.route) + ' = ' + t.contribution + '%</span>';
    else if (t.status === 'already_secured') line = '<span style="color:#3F7A5C;font-weight:700;">Already secured</span>';
    else if (t.status === 'impossible') line = '<span style="color:#8F3B23;font-weight:700;">Not mathematically possible</span>';
    else if (t.status === 'multiple_unknown') line = '<span style="color:#8A7A68;">Leave only one component blank to solve</span>';
    else if (t.status === 'no_component') line = '<span style="color:#8A7A68;">This component has no weighting on this route</span>';
    else line = '<span style="font-weight:700;">Need ' + t.requiredValue + '% on ' + esc((t.component || '').toUpperCase()) + '</span>';
    return '<div style="margin-top:8px;"><div style="font-size:12.5px;font-weight:700;">' + esc(t.label) + ' <span style="color:#8A7A68;font-weight:400;">(' + t.targetMark + '% target)</span></div>' +
      '<div style="font-size:13px;">' + line + '</div>' + reasonsListHtml_(t.reasons) + '</div>';
  }).join('');
  return '<div style="margin-top:10px;border-top:1px solid #F0DCC8;padding-top:8px;">' +
    reasonsListHtml_(res.reasons) + routeHtml + targetsHtml +
    (res.fmpAndOfficial ? pipelineHtml_(mi, res.fmpAndOfficial, null) : '') + '</div>';
}

function whatIfSimulatorHtml_(mi) {
  var code = mi.code;
  var open = !!state.whatIfOpen[code];
  if (!open) {
    return '<div style="font-size:11.5px;color:#B24B2E;font-weight:700;margin-top:8px;cursor:pointer;" class="ep-clickable" onclick="' + h_('toggleWhatIfOpen_', [code]) + '">Open Assessment Simulator ("What If?") ▾</div>';
  }
  var inputs = state.whatIfInput[code] || {};
  var error = state.whatIfError[code];
  var loading = state.whatIfLoading[code];
  var fields = ['af', 'a1', 'a2', 'a3'].map(function (k) {
    var v = (inputs[k] !== undefined) ? inputs[k] : '';
    return '<div style="display:flex;flex-direction:column;gap:2px;"><label style="font-size:10.5px;color:#8A7A68;font-weight:700;">' + k.toUpperCase() + '</label>' +
      '<input type="text" placeholder="Unknown" value="' + escAttr(v) + '" oninput="' + hv_('setWhatIfInput_', [code, k]) + '" style="width:88px;padding:7px 8px;border-radius:8px;border:1px solid #E7C7A9;font-size:12.5px;font-family:\'Inter\',sans-serif;"></div>';
  }).join('');
  return '<div style="margin-top:12px;border-top:1px solid #F0DCC8;padding-top:10px;">' +
    '<div style="font-size:10.5px;font-weight:700;letter-spacing:0.5px;color:#8A7A68;margin-bottom:4px;">ASSESSMENT SIMULATOR ("WHAT IF?") — entirely hypothetical, never real recorded marks</div>' +
    '<div style="font-size:11.5px;color:#8A7A68;margin-bottom:6px;">Leave a component blank for "Unknown" (solve for it), or leave it out of your thinking entirely by leaving ALL of one component blank across every field you don\'t want considered. Numbers 0–100 only.</div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">' + fields +
    '<div class="ep-clickable" onclick="' + h_('runWhatIfSimulation_', [mi.name, code]) + '" style="background:#DD7A56;color:#fff;font-weight:700;font-size:12px;padding:8px 14px;border-radius:8px;cursor:pointer;">' + (loading ? 'Simulating…' : 'Simulate') + '</div>' +
    '<div class="ep-clickable" onclick="' + h_('toggleWhatIfOpen_', [code]) + '" style="background:#F3E3D2;color:#3B332B;font-weight:700;font-size:12px;padding:8px 14px;border-radius:8px;cursor:pointer;">Close</div>' +
    '</div>' +
    (error ? '<div style="font-size:11.5px;color:#8F3B23;margin-top:6px;">' + esc(error) + '</div>' : '') +
    whatIfResultHtml_(mi, code) + '</div>';
}

    (mi.riskAnalysis ? '<div><div style="font-size:10.5px;color:#8A7A68;">Marks Risk Analysis</div><div style="margin-top:2px;">' + miBadgeHtml_(mi.riskAnalysis.level, mi.riskAnalysis.level) + '</div></div>' : '') +

    '</div>';
}

// v1.2.0 ACADEMIC WORKFLOW RELEASE -- Feature 7: simple attendance-sensitive
// session tracking. "TODAY'S NON-NEGOTIABLE CLASSES" is new -- today's real
// timetable sessions that are a Tutorial (compulsory by default), an
// attendance-sensitive lecture, or a compulsory practical/lab, each with a

// Deliberately no percentages, no safe-absence math, no analytics here.

function todayMandatorySessionHtml_(s) {
  var statusColors = { 'Not recorded': ['#F3E3D2', '#8A7A68'], Attended: ['#E4F0E9', '#3F7A5C'], Missed: ['#F7E2D8', '#8F3B23'] };
  var colors = statusColors[s.status] || statusColors['Not recorded'];
  return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-left:5px solid ' + s.color + ';border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;gap:8px;">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">' +
    '<div><div style="font-weight:700;font-size:14.5px;">' + esc(s.module) + ' ' + esc(s.type) + '</div><div style="font-size:12px;color:#8A7A68;">' + esc(s.time) + (s.venue ? ' · ' + esc(s.venue) : '') + '</div></div>' +
    '<div style="font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;background:' + colors[0] + ';color:' + colors[1] + ';">' + esc(s.status) + '</div>' +
    '</div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap;">' +
    '<div class="ep-clickable" onclick="' + h_('setAttendanceUi_', [s.key, 'Attended']) + '" style="' + (s.busy ? 'opacity:.5;pointer-events:none;' : '') + 'flex:1;min-width:100px;text-align:center;background:#E4F0E9;color:#3F7A5C;font-weight:700;font-size:12.5px;padding:8px;border-radius:8px;cursor:pointer;">☐ Attended</div>' +
    '<div class="ep-clickable" onclick="' + h_('setAttendanceUi_', [s.key, 'Missed']) + '" style="' + (s.busy ? 'opacity:.5;pointer-events:none;' : '') + 'flex:1;min-width:100px;text-align:center;background:#F7E2D8;color:#8F3B23;font-weight:700;font-size:12.5px;padding:8px;border-radius:8px;cursor:pointer;">☐ Missed</div>' +
    '</div>' +
    (s.status === 'Missed' ? '<div class="ep-clickable" onclick="' + h_('createCatchUpUi_', [s.module, s.type, s.dateIso]) + '" style="font-size:12px;font-weight:700;color:#B24B2E;cursor:pointer;">Create catch-up study task</div>' : '') +
    '</div>';

// down to exactly what the spec asks for -- today's non-negotiable classes,
// Attended/Missed, and "Create catch-up study task." The per-module
// percentage/progress summary (bars + "attended/total" counts) that used to
// sit below it has been removed from this screen entirely: no percentage,

}

    '<div style="font-size:11.5px;font-weight:700;color:' + (vm.automationLastRun.enabled ? '#3F7A5C' : '#8F3B23') + ';">' + (vm.automationLastRun.enabled ? '● Installed' : '○ Not installed') + '</div></div>' +

    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:16px;padding:18px;">' +

    '<div style="font-size:12.5px;color:#8A7A68;margin-bottom:12px;">Makes a full file copy. Automation triggers are not copied — re-enable inside the copy.</div>' +
    '<div class="ep-clickable" onclick="' + h_('runDuplicateSemester', []) + '" style="background:#DD7A56;color:#fff;text-align:center;font-size:13px;font-weight:700;padding:10px;border-radius:10px;cursor:pointer;">Duplicate</div></div>' +

}

function screenGuide_(vm) {
  var entries = vm.guideEntries.map(function (g) {
    return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:16px;padding:16px 20px;">' +
      '<div style="font-weight:700;font-size:15px;margin-bottom:4px;">' + esc(g.title) + '</div>' +

  return '<div><div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:44px;">User Guide</div>' +

</script>
<script>
'use strict';
// ============================================================
// v1.2.0 ACADEMIC WORKFLOW RELEASE -- action functions for every new screen
// (Study Planner, Revision Tracker, Resources, Attendance, Module
// configuration/contacts, Activity history filter). Follows the same
// conventions as every existing action function above: mutate `state`
// synchronously for instant UI feedback, call render(), then call
// runScript_('api_...', [...]) and on success call loadPlannerData() to
// pull the authoritative row back from the workbook. state.raw (already
// populated by loadPlannerData()) is used read-only here to look up an
// existing record when opening an "edit" form -- nothing here invents data.
// ============================================================

function findRaw_(list, idField, id) {
  if (!state.raw || !state.raw[list]) return null;
  var found = null;
  state.raw[list].forEach(function (r) { if (r[idField] === id) found = r; });
  return found;
}

// ---- Study Planner: add/edit session ----
function openStudySessionForm_(sessionId) {
  state.independentStudyFormOpen = false;
  state.suggestionsPreview = null;
  if (sessionId) {
    var d = findRaw_('studySessions', 'id', sessionId);
    if (!d) { showToast_('error', 'Could not find that study session.'); return; }
    state.studySessionForm = {
      module: d.module, date: d.date || '', startTime: d.startTime || '', duration: d.duration || '',
      studyType: d.type, topic: d.topic || '', objective: d.objective || '', priority: d.priority || 'Medium',
      notes: d.notes || '', syncToCalendar: !!d.calendarEventId, error: '', saving: false
    };
    state.studySessionEditingId = sessionId;
  } else {
    state.studySessionForm = {
      module: '', date: '', startTime: '', duration: '', studyType: 'Practice', topic: '', objective: '',
      priority: 'Medium', notes: '', syncToCalendar: true, error: '', saving: false
    };
    state.studySessionEditingId = null;
  }
  state.studySessionFormOpen = true;
  render();
}
function closeStudySessionForm_() {
  state.studySessionFormOpen = false; state.studySessionForm = null; state.studySessionEditingId = null;
  render();
}
function setStudySessionField_(field, value) {
  // no render(): a full render() on every keystroke rebuilds the whole
  // page's innerHTML, which destroys and recreates this input and drops
  // focus after one character. Matches setInboxField_/setMarkField_.
  state.studySessionForm = Object.assign({}, state.studySessionForm, (function () { var o = {}; o[field] = value; o.error = ''; return o; })());
}
function toggleStudySessionSync_() {
  var f = state.studySessionForm;
  state.studySessionForm = Object.assign({}, f, { syncToCalendar: !f.syncToCalendar });
  render();
}
function saveStudySession_() {
  var f = state.studySessionForm;
  if (f.saving) return;
  if (!f.module) { setStudySessionField_('error', 'Choose a module.'); render(); return; }
  if (!f.date) { setStudySessionField_('error', 'Choose a date.'); render(); return; }
  state.studySessionForm = Object.assign({}, f, { saving: true, error: '' });
  render();
  var editingId = state.studySessionEditingId;
  var apiName = editingId ? 'api_updateStudySession' : 'api_addStudySession';
  var args = editingId ? [editingId, f] : [f];
  runScript_(apiName, args).then(function (res) {
    if (!res.ok) {
      state.studySessionForm = Object.assign({}, f, { saving: false, error: res.error });
      showToast_('error', 'Could not save: ' + res.error);
      render();
      return;
    }
    showToast_('success', editingId ? 'Study session updated.' : 'Study session added.');
    closeStudySessionForm_();
    loadPlannerData();
  });
}

// ---- Study Planner: log independent study ----
function openIndependentStudyForm_() {
  state.studySessionFormOpen = false;
  state.suggestionsPreview = null;
  state.independentStudyForm = {
    module: '', topic: '', date: '', duration: '', taskType: 'Practice', activityName: '',
    score: '', confidence: '', notes: '', error: '', saving: false
  };
  state.independentStudyFormOpen = true;
  render();
}
function closeIndependentStudyForm_() {
  state.independentStudyFormOpen = false; state.independentStudyForm = null;
  render();
}
function setIndependentField_(field, value) {
  // no render(): free typing, matches setStudySessionField_.
  state.independentStudyForm = Object.assign({}, state.independentStudyForm, (function () { var o = {}; o[field] = value; o.error = ''; return o; })());
}
function saveIndependentStudy_() {
  var f = state.independentStudyForm;
  if (f.saving) return;
  if (!f.module) { setIndependentField_('error', 'Choose a module.'); render(); return; }
  if (!(f.topic || '').trim()) { setIndependentField_('error', 'Give this a topic.'); render(); return; }
  if (!f.duration) { setIndependentField_('error', 'Enter how many minutes.'); render(); return; }
  state.independentStudyForm = Object.assign({}, f, { saving: true, error: '' });
  render();
  runScript_('api_logIndependentStudy', [f]).then(function (res) {
    if (!res.ok) {
      state.independentStudyForm = Object.assign({}, f, { saving: false, error: res.error });
      showToast_('error', 'Could not log: ' + res.error);
      render();
      return;
    }
    showToast_('success', 'Independent study logged — Revision Tracker updated.');
    closeIndependentStudyForm_();
    loadPlannerData();
  });
}

// ---- Study Planner: weekly suggestions preview/accept ----
function setSuggestionsWeekOffset_(value) {
  state.suggestionsWeekOffset = parseInt(value, 10) || 0;
  render();
}
function doGenerateSuggestions_() {
  state.suggestionsLoading = true; render();
  // api_generateStudySuggestions already accepts a week-anchor date and
  // resolves it to that week's Monday server-side -- any date inside the
  // target week works, so "today + N*7 days" is enough for the "up to 3
  // weeks ahead" selector above.
  var offsetDays = (state.suggestionsWeekOffset || 0) * 7;
  var anchor = new Date();
  anchor.setDate(anchor.getDate() + offsetDays);
  var anchorIso = anchor.getFullYear() + '-' + String(anchor.getMonth() + 1).padStart(2, '0') + '-' + String(anchor.getDate()).padStart(2, '0');
  // v1.4.3 -- session-only priority picks from the "Which modules?"
  // checklist, sent for this one call only -- see setStudyGenPriorityOverride_.
  runScript_('api_generateStudySuggestions', [anchorIso, state.studyGenPriorityOverrides]).then(function (res) {
    state.suggestionsLoading = false;
    if (!res.ok) { showToast_('error', 'Could not generate suggestions: ' + res.error); render(); return; }
    state.suggestionsPreview = res.data;
    render();
  });
}
function closeSuggestions_() { state.suggestionsPreview = null; render(); }
function setSuggestionField_(i, field, value) {
  // no render(): free typing (topic), matches setStudySessionField_.
  var p = state.suggestionsPreview;
  if (!p) return;
  p.suggestions[i] = Object.assign({}, p.suggestions[i], (function () { var o = {}; o[field] = value; return o; })());
}
function rejectOneSuggestion_(i) {
  var p = state.suggestionsPreview;
  if (!p) return;
  p.suggestions[i] = Object.assign({}, p.suggestions[i], { _rejected: true });
  render();
}
function acceptOneSuggestion_(i) {
  var p = state.suggestionsPreview;
  if (!p) return;
  var s = p.suggestions[i];
  if (!s.module) { showToast_('error', 'Choose a module for this suggestion first.'); return; }
  runScript_('api_acceptStudySuggestions', [[s]]).then(function (res) {
    if (!res.ok) { showToast_('error', 'Could not accept: ' + res.error); return; }
    showToast_('success', 'Study session added from suggestion.');
    p.suggestions[i] = Object.assign({}, s, { _rejected: true });
    render();
    loadPlannerData();
  });
}

// ---- Study Planner: complete/close out a session ----
function toggleCompleteSessionUi_(sessionId) {
  if (state.completingSessionId === sessionId) {
    state.completingSessionId = null; state.completeSessionForm = null;
  } else {
    var s = findRaw_('studySessions', 'id', sessionId);
    state.completingSessionId = sessionId;
    state.completeSessionForm = { status: 'Completed', actualDuration: (s && s.duration) || '', confidenceAfter: '', note: '' };
  }
  render();
}
function setCompleteField_(field, value) {
  // no render(): free typing (actual minutes / confidence % / note), matches setStudySessionField_.
  state.completeSessionForm = Object.assign({}, state.completeSessionForm, (function () { var o = {}; o[field] = value; return o; })());
}
function closeCompleteSession_() { state.completingSessionId = null; state.completeSessionForm = null; render(); }
function saveCompleteSession_(sessionId) {
  var f = state.completeSessionForm;
  runScript_('api_completeStudySession', [sessionId, f]).then(function (res) {
    if (!res.ok) { showToast_('error', 'Could not save: ' + res.error); return; }
    showToast_('success', 'Session ' + f.status.toLowerCase() + '.' + (res.data.revisionUpdated ? ' Revision Tracker updated.' : ''));
    state.completingSessionId = null; state.completeSessionForm = null;
    loadPlannerData();
  });
}

// ---- Study Planner: per-session task checklist ----
function setNewTaskText_(sessionId, value) { state.newTaskTextBySession[sessionId] = value; }
function addStudyTaskUi_(sessionId) {
  var text = (state.newTaskTextBySession[sessionId] || '').trim();
  if (!text) return;
  runScript_('api_addStudyTask', [sessionId, { text: text, taskType: state.newTaskTypeBySession[sessionId] || 'Custom' }]).then(function (res) {
    if (!res.ok) { showToast_('error', 'Could not add task: ' + res.error); return; }
    state.newTaskTextBySession[sessionId] = '';
    loadPlannerData();
  });
}
function toggleStudyTaskUi_(taskId, completed) {
  runScript_('api_toggleStudyTask', [taskId, completed]).then(function (res) {
    if (!res.ok) { showToast_('error', 'Could not update task: ' + res.error); return; }
    loadPlannerData();
  });
}
function deleteStudyTaskUi_(taskId, text) {
  openConfirmModal('Delete this task?', '"' + text + '" will be removed from this session\'s checklist.', 'doDeleteStudyTaskUi_', [taskId]);
}
function doDeleteStudyTaskUi_(taskId) {

// v1.4.0 -- Drive upload form. See driveUploadFormHtml_ for why the file
// input itself has no state/onchange wiring.
var MAX_DRIVE_UPLOAD_BYTES_CLIENT_ = 20 * 1024 * 1024; // matches MAX_UPLOAD_BYTES in Drive_Resources_v1.4.0.js
function openDriveUploadForm_() {
  state.resourceFormOpen = false;

  state.driveUploadFormOpen = true;

function setDriveUploadField_(field, value) {

  // never touched by the file input itself (no onchange here) -- a render()
  // between choosing a file and clicking Upload would rebuild the <input>
  // and lose the selection, since a browser file input's chosen file can't
  // be restored programmatically after its DOM node is replaced.
  state.driveUploadForm = Object.assign({}, state.driveUploadForm, (function () { var o = {}; o[field] = value; o.error = ''; return o; })());
}
function saveDriveUpload_() {
  var f = state.driveUploadForm;
  if (!f || state.driveUploadSaving) return;
  if (!f.module) { setDriveUploadField_('error', 'Choose a module.'); render(); return; }
  if (!(f.title || '').trim()) { setDriveUploadField_('error', 'Give this resource a name.'); render(); return; }
  var fileInput = document.getElementById('drive-upload-file-input');
  var file = fileInput && fileInput.files && fileInput.files[0];
  if (!file) { setDriveUploadField_('error', 'Choose a file to upload.'); render(); return; }
  if (file.size > MAX_DRIVE_UPLOAD_BYTES_CLIENT_) {
    setDriveUploadField_('error', 'File is too large (' + Math.round(file.size / 1024 / 1024) + 'MB). Keep uploads under ' + Math.round(MAX_DRIVE_UPLOAD_BYTES_CLIENT_ / 1024 / 1024) + 'MB.');
    render();

  }
  state.driveUploadSaving = true; render();
  var reader = new FileReader();
  reader.onerror = function () {
    state.driveUploadSaving = false;
    showToast_('error', 'Could not read the file — try choosing it again.');
    render();
  };
  reader.onload = function () {
    // reader.result is "data:<mime>;base64,<data>" -- strip the prefix, the
    // backend only wants the base64 payload itself.
    var base64 = String(reader.result).split(',')[1] || '';

      module: f.module, category: f.category, title: f.title, topic: f.topic, priority: f.priority, notes: f.notes,

      closeDriveUploadForm_();
      loadPlannerData();
    });
  };
  reader.readAsDataURL(file);
}

  state.whatIfInput[code] = state.whatIfInput[code] || {};
  state.whatIfInput[code][key] = value; // no render(): free typing (matches setPublishedFinalInput_)
}
function runWhatIfSimulation_(moduleName, code) {
  var typed = state.whatIfInput[code] || {};
  // A key is only sent to the backend if the user has actually touched that
  // field -- an untouched field is EXCLUDED from the scenario entirely
  // (spec §6: hypothetical inputs only), matching mi_simulateWhatIf_'s
  // "included" vs "omitted" distinction. A touched-but-blank field is sent
  // as null ("Unknown" -- solve for this one).
  var hypothetical = {};
  var touchedAny = false;
  ['af', 'a1', 'a2', 'a3'].forEach(function (k) {
    if (!(k in typed)) return;
    touchedAny = true;
    var raw = typed[k];
    if (raw === '' || raw === undefined || raw === null) { hypothetical[k] = null; return; }
    var n = parseFloat(raw);
    hypothetical[k] = isNaN(n) ? null : n;
  });
  if (!touchedAny) {
    state.whatIfError[code] = 'Enter at least one hypothetical value (or leave a component blank to solve for it).';
    render();
    return;
  }
  state.whatIfError[code] = null;
  state.whatIfLoading[code] = true;
  render();
  runScript_('api_simulateAssessment', [moduleName, hypothetical]).then(function (res) {
    state.whatIfLoading[code] = false;
    if (!res.ok) { state.whatIfError[code] = res.error; state.whatIfResult[code] = null; render(); return; }
    state.whatIfResult[code] = res.data;
    render();
  });
}
</script>
<script>
'use strict';

// ---- Boot. No React, no CDN fetch, no template compiler, no
//      window.parent/postMessage bridge to a host editor. Just: render a
//      loading state immediately, then ask the backend for real data. ----
window.onerror = function (msg, url, line, col, err) {
  // A visible failure path instead of a silently blank/frozen page — this is
  // the one thing the previous dc-runtime boot chain did NOT have.
  try {
    document.getElementById('app').innerHTML =
      '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F6E3D1;font-family:\'Inter\',sans-serif;padding:24px;">' +
      '<div style="max-width:460px;background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:28px;text-align:center;">' +
      '<div style="font-size:34px;margin-bottom:10px;">⚠</div>' +
      '<div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:28px;color:#8F3B23;margin-bottom:8px;">Something went wrong</div>' +
      '<div style="font-size:13px;color:#8A7A68;margin-bottom:18px;">' + esc(String(msg)) + '</div>' +
      '<div onclick="window.location.reload()" style="display:inline-block;background:#DD7A56;color:#fff;font-weight:700;padding:11px 22px;border-radius:10px;cursor:pointer;">Reload</div>' +
      '</div></div>';
  } catch (e) { /* nothing more we can do */ }
  return false;
};

function boot() {
  render(); // shows the loading state immediately
  loadPlannerData();
}

if (document.readyState !== 'loading') boot();
else document.addEventListener('DOMContentLoaded', boot);

// v1.1.12 -- feature 4: refresh when the tab becomes visible again after at
// least five minutes away. Deliberately NOT setInterval() -- this only ever
// fires in response to the browser's own visibilitychange event, so there
// is no constant background polling. Switching tabs quickly is a no-op
// because of the five-minute gate; loadPlannerData()'s own in-flight guard
// (above) prevents this from ever overlapping with an already-running load.
// This never triggers Inbox processing or Calendar sync on its own -- only
// the same read-only planner-data load the boot sequence already does.
var AUTO_REFRESH_AFTER_MS = 5 * 60 * 1000;
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState !== 'visible') return;
  if (!_lastSuccessfulLoadAt) return; // no successful load yet -- boot()/its own retry handles that
  if (Date.now() - _lastSuccessfulLoadAt < AUTO_REFRESH_AFTER_MS) return;
  loadPlannerData();
});
</script>

    '<div class="ep-clickable" onclick="' + h_('openSemDeleteFlow_', []) + '" style="background:#A6392E;color:#fff;font-weight:700;font-size:12.5px;padding:10px 16px;border-radius:10px;cursor:pointer;">Delete Semester (Report + Backup + Archive first)</div>' +

// ---- small shared building blocks ----
function semActionCardHtml_(title, desc, btnLabel, action, args) {
  return '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:16px;padding:16px;">' +
    '<div style="font-weight:700;font-size:14px;margin-bottom:6px;">' + esc(title) + '</div>' +

    '<div class="ep-clickable" onclick="' + h_(action, args) + '" style="display:inline-block;background:#DD7A56;color:#fff;font-size:12px;font-weight:700;padding:9px 14px;border-radius:10px;cursor:pointer;">' + esc(btnLabel) + '</div></div>';
}
function semReflectionFieldHtml_(label, key, value) {
  return '<div style="margin-bottom:10px;"><div style="font-size:12px;font-weight:600;color:#5A4D40;margin-bottom:4px;">' + esc(label) + '</div>' +

}
function semBarsHtml_(title, data, unitSuffix) {
  if (!data || !data.length) return '<div style="margin-bottom:14px;"><div style="font-weight:700;font-size:13px;margin-bottom:6px;">' + esc(title) + '</div><div style="font-size:12px;color:#8A7A68;">No data yet.</div></div>';
  var max = Math.max.apply(null, data.map(function (dd) { return Math.abs(dd.value) || 0; })) || 1;
  var rows = data.map(function (dd) {
    var pct = Math.max(2, Math.round((Math.abs(dd.value) / max) * 100));
    return '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">' +
      '<div style="width:120px;flex-shrink:0;font-size:11.5px;color:#5A4D40;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + esc(dd.label) + '</div>' +
      '<div style="flex:1;background:#F3E3D2;border-radius:6px;height:14px;overflow:hidden;"><div style="width:' + pct + '%;background:#DD7A56;height:100%;"></div></div>' +
      '<div style="width:56px;flex-shrink:0;text-align:right;font-size:11.5px;font-weight:700;">' + esc(dd.value) + (unitSuffix || '') + '</div></div>';
  }).join('');
  return '<div style="margin-bottom:14px;"><div style="font-weight:700;font-size:13px;margin-bottom:8px;">' + esc(title) + '</div>' + rows + '</div>';
}
function semStatChip_(label, value) {

}
function fmtPct_(v) { return (typeof v === 'number') ? (v + '%') : '—'; }

// ---- report viewer (spec §2 + §3 charts) ----

    '<div style="font-weight:700;font-size:13px;margin:18px 0 8px;">ATTENDANCE</div>' +

      : '') +
