// ---- archived semesters / historical comparison / backups (spec §4, §10, §5) ----
function semArchivedListHtml_(vm) {
  var rows = (vm.semData.archivedSemesters || []).map(function (a) {
    return '<div class="ep-clickable" onclick="' + h_('openArchivedReport_', [a.semesterId]) + '" style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;padding:12px 16px;border-bottom:1px solid #F3E3D2;cursor:pointer;font-size:13px;">' +
      '<span style="font-weight:600;">' + esc(a.semesterName) + (a.academicYear ? ' · ' + esc(a.academicYear) : '') + '</span>' +
      '<span style="color:#8A7A68;">' + esc(a.completionDate || '') + '</span>' +
      '<span style="color:#3F7A5C;font-weight:700;">' + esc(a.semesterId) + '</span></div>';
  }).join('');
  return '<div style="margin-bottom:20px;"><div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:10px;">ARCHIVED SEMESTERS</div>' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:16px;overflow:hidden;">' +
    (rows || '<div style="padding:14px 16px;font-size:13px;color:#8A7A68;">No semesters archived yet.</div>') + '</div></div>';
}
function semCompareHtml_(vm) {
  var toggle = '<div class="ep-clickable" onclick="' + h_('toggleSemCompare_', []) + '" style="display:inline-block;margin-bottom:10px;font-size:12px;font-weight:700;color:#B24B2E;cursor:pointer;">' + (vm.semCompareView ? 'Hide Historical Analytics ▲' : 'Show Historical Analytics ▼') + '</div>';
  if (!vm.semCompareView) return '<div style="margin-bottom:20px;">' + toggle + '</div>';
  var rows = (vm.semHistory || []).map(function (h) {
    return '<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px;padding:10px 16px;border-bottom:1px solid #F3E3D2;font-size:12px;">' +
      '<span style="font-weight:600;flex:1.4;min-width:120px;">' + esc(h.semesterName) + '</span>' +
      '<span style="flex:1;text-align:center;">Avg ' + fmtPct_(h.avgMark) + '</span>' +
      '<span style="flex:1;text-align:center;">' + h.studyHours + 'h study</span>' +
      '<span style="flex:1;text-align:center;">Att ' + fmtPct_(h.attendanceRate) + '</span>' +
      '<span style="flex:1;text-align:center;">' + h.distinctionCount + ' dist.</span>' +
      '</div>';
  }).join('');
  return '<div style="margin-bottom:20px;">' + toggle +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:16px;overflow:hidden;">' +
    (rows || '<div style="padding:14px 16px;font-size:13px;color:#8A7A68;">' + (vm.semHistory === null ? 'Loading…' : 'No historical data yet.') + '</div>') + '</div></div>';
}
function semBackupsListHtml_(vm) {
  var rows = (vm.semData.backups || []).map(function (b) {
    return '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 16px;border-bottom:1px solid #F3E3D2;font-size:12px;">' +
      '<span>' + esc(b.backupId) + ' · ' + esc((b.timestamp || '').slice(0, 16).replace('T', ' ')) + '</span>' +
      '<span style="display:flex;gap:12px;align-items:center;">' +
      '<span class="ep-clickable" onclick="' + h_('runSemVerifyBackup_', [b.backupId]) + '" style="cursor:pointer;color:#3F7A5C;font-weight:700;">Verify</span>' +
      '<a href="' + escAttr(b.fileUrl) + '" target="_blank" style="color:#B24B2E;font-weight:700;">Open in Drive ↗</a></span></div>';
  }).join('');
  return '<div><div style="font-size:11px;font-weight:700;letter-spacing:1px;color:#B24B2E;margin-bottom:10px;">BACKUPS</div>' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:16px;overflow:hidden;">' +
    (rows || '<div style="padding:14px 16px;font-size:13px;color:#8A7A68;">No backups yet.</div>') + '</div></div>';
}

// ---- New Semester Wizard (spec §8) ----
function semWizardScreenHtml_(vm) {
  var w = vm.semWizard, step = w.step, cfg = w.config, opts = w.options;
  var body = '';
  if (step === 1) {
    body = '<div style="font-weight:700;font-size:15px;margin-bottom:10px;">Step 1 — Semester identity</div>' +
      semField_('Semester name', 'semesterName', cfg.semesterName, 'text') +
      semField_('Academic year', 'academicYear', cfg.academicYear, 'text') +
      semField_('Start date', 'startDate', cfg.startDate, 'date') +
      semField_('End date', 'endDate', cfg.endDate, 'date');
  } else if (step === 2) {
    var templateRows = (opts.templates || []).map(function (t) {
      var checked = (cfg.reuseModuleCodes || []).indexOf(t.code) !== -1;
      return '<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;"><input type="checkbox" ' + (checked ? 'checked' : '') + ' onclick="' + h_('wizardToggleModule_', [t.code]) + '">' +
        '<span style="width:12px;height:12px;border-radius:50%;background:' + esc(t.color || '#8B8B87') + ';display:inline-block;"></span>' + esc(t.name) + ' (' + esc(t.code) + ')</label>';
    }).join('');
    body = '<div style="font-weight:700;font-size:15px;margin-bottom:10px;">Step 2 — Modules</div>' +
      semRadioRow_('modulesMode', [['reuse', 'Reuse from Module Templates'], ['new', 'Create new (configure manually afterward)']], cfg.modulesMode) +
      (cfg.modulesMode === 'reuse' ? ('<div style="margin-top:10px;">' + (templateRows || '<div style="font-size:12px;color:#8A7A68;">No saved templates yet — use "Refresh Templates" on the Dashboard first, or choose Create new.</div>') + '</div>') : '') +
      '<div style="font-size:11.5px;color:#8A7A68;margin-top:8px;">Modules already in "03 Modules" (kept by Reset) are untouched either way — this only restores modules from templates that aren\'t already there.</div>';
  } else if (step === 3) {
    body = '<div style="font-weight:700;font-size:15px;margin-bottom:10px;">Step 3 — Module colours</div>' +
      semRadioRow_('coloursMode', [['preserve', 'Preserve previous colours'], ['edit', 'Edit colours now']], cfg.coloursMode) +
      (cfg.coloursMode === 'edit' ? (opts.currentModules || []).map(function (m) {
        return '<div style="display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px;">' + esc(m.name) +
          '<input type="color" value="' + escAttr((cfg.colourOverrides || {})[m.code] || m.color || '#8B8B87') + '" oninput="' + hv_('wizardSetColour_', [m.code]) + '"></div>';
      }).join('') : '');
  } else if (step === 4) {
    body = '<div style="font-weight:700;font-size:15px;margin-bottom:10px;">Step 4 — Timetable</div>' +
      semRadioRow_('timetableMode', [['import', 'Keep current "05 Timetable Import" rows'], ['skip', 'Clear it — I\'ll enter a fresh timetable']], cfg.timetableMode) +
      '<div style="font-size:11.5px;color:#8A7A68;margin-top:8px;">' + opts.timetableRowCount + ' row(s) currently in "05 Timetable Import".</div>';
  } else if (step === 5) {
    body = '<div style="font-weight:700;font-size:15px;margin-bottom:10px;">Step 5 — Assessment frameworks</div>' +
      semRadioRow_('rulesMode', [['reuse', 'Reuse verified Module Rules from templates'], ['new', 'Create new (configure manually afterward)']], cfg.rulesMode);
  } else if (step === 6) {
    body = '<div style="font-weight:700;font-size:15px;margin-bottom:10px;">Step 6 — Calendar</div>' +
      semRadioRow_('calendarMode', [['reuse', 'Reuse current calendar (' + esc(opts.currentCalendarId || 'none set') + ')'], ['new', 'Create a new Planner Calendar'], ['skip', 'Skip — no calendar sync for now']], cfg.calendarMode) +
      (cfg.calendarMode === 'new' ? semField_('New calendar name', 'newCalendarName', cfg.newCalendarName, 'text') : '');
  } else if (step === 7) {
    body = '<div style="font-weight:700;font-size:15px;margin-bottom:10px;">Step 7 — Review</div>' +
      '<div style="font-size:13px;line-height:1.9;">' +
      '<b>Semester:</b> ' + esc(cfg.semesterName || '—') + (cfg.academicYear ? (' (' + esc(cfg.academicYear) + ')') : '') + '<br>' +
      '<b>Dates:</b> ' + esc(cfg.startDate || '—') + ' to ' + esc(cfg.endDate || '—') + '<br>' +
      '<b>Modules:</b> ' + (cfg.modulesMode === 'reuse' ? ((cfg.reuseModuleCodes || []).length + ' reused from templates') : 'Create new') + '<br>' +
      '<b>Colours:</b> ' + (cfg.coloursMode === 'edit' ? 'Edited' : 'Preserved') + '<br>' +
      '<b>Timetable:</b> ' + (cfg.timetableMode === 'skip' ? 'Cleared for fresh entry' : 'Kept') + '<br>' +
      '<b>Assessment frameworks:</b> ' + (cfg.rulesMode === 'reuse' ? 'Reused from templates' : 'Create new') + '<br>' +
      '<b>Calendar:</b> ' + esc(cfg.calendarMode) + (cfg.calendarMode === 'new' ? (' — ' + esc(cfg.newCalendarName || '')) : '') +
      '</div>' +
      (w.error ? '<div style="color:#A6392E;font-size:12.5px;margin-top:10px;">' + esc(w.error) + '</div>' : '');
  }

  var nav = '<div style="display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;">' +
    (step > 1 ? '<div class="ep-clickable" onclick="' + h_('wizardBack_', []) + '" style="background:#F3E3D2;color:#3B332B;font-weight:600;font-size:13px;padding:10px 16px;border-radius:10px;cursor:pointer;">Back</div>' : '') +
    (step < 7
      ? '<div class="ep-clickable" onclick="' + h_('wizardNext_', []) + '" style="background:#DD7A56;color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:10px;cursor:pointer;">Next</div>'
      : '<div class="ep-clickable" onclick="' + h_('wizardApply_', []) + '" style="background:#3F7A5C;color:#fff;font-weight:700;font-size:13px;padding:10px 16px;border-radius:10px;cursor:pointer;">' + (w.applying ? 'Creating semester…' : 'Confirm — Create Semester') + '</div>') +
    '<div class="ep-clickable" onclick="' + h_('closeSemWizard_', []) + '" style="color:#8A7A68;font-size:12.5px;padding:10px;cursor:pointer;">Cancel</div>' +
    '</div>';

  return '<div><div style="font-family:\'Caveat\',cursive;font-weight:700;font-size:44px;">New Semester Wizard</div>' +
    '<div style="font-size:13px;color:#8A7A68;margin-bottom:16px;">Step ' + step + ' of 7</div>' +
    '<div style="background:#FDF6F0;border:1px solid #F0DCC8;border-radius:18px;padding:22px;max-width:560px;">' + body + nav + '</div></div>';
}
function semField_(label, key, value, type) {
  return '<div style="margin-bottom:10px;"><div style="font-size:12px;font-weight:600;color:#5A4D40;margin-bottom:4px;">' + esc(label) + '</div>' +
    '<input type="' + type + '" value="' + escAttr(value || '') + '" oninput="' + hv_('wizardSetField_', [key]) + '" style="width:100%;box-sizing:border-box;padding:9px;border-radius:8px;border:1px solid #E7C7A9;font-size:13px;font-family:\'Inter\',sans-serif;"></div>';
}
function semRadioRow_(key, options, current) {
  return '<div style="display:flex;flex-direction:column;gap:6px;">' + options.map(function (o) {
    return '<label style="display:flex;align-items:center;gap:8px;font-size:13px;"><input type="radio" name="' + esc(key) + '" ' + (current === o[0] ? 'checked' : '') + ' onclick="' + h_('wizardSetField_', [key, o[0]]) + '">' + esc(o[1]) + '</label>';
  }).join('') + '</div>';
}

// ---- Dashboard data loading ----
function loadSemesterDashboard_() {
  state.semLoading = true; render();
  runScript_('api_semDashboard', []).then(function (res) {
    state.semLoading = false;
    if (!res.ok) { showToast_('error', 'Could not load the Semester Dashboard: ' + res.error); render(); return; }
    state.semData = res.data;
    render();
  });
}
function setSemReflectionField_(key, value) { state.semReflection[key] = value; } // no render(): free typing

// ---- Report (spec §2/§3) ----
function runSemGenerateReport_() {
  state.semLoading = true; render();
  runScript_('api_semGenerateReport', [state.semReflection]).then(function (res) {
    state.semLoading = false;
    if (!res.ok) { showToast_('error', 'Could not generate the report: ' + res.error); render(); return; }
    state.semReportView = { report: res.data.report, charts: res.data.charts, isArchived: false, semesterId: res.data.report.meta.semesterId };
    window.scrollTo(0, 0); render();
  });
}
function closeSemReport_() { state.semReportView = null; render(); }
function openArchivedReport_(semesterId) {
  runScript_('api_semGetArchivedReport', [semesterId]).then(function (res) {
    if (!res.ok) { showToast_('error', 'Could not open that archive: ' + res.error); return; }
    state.semReportView = { report: res.data.report, charts: res.data.charts, isArchived: true, semesterId: semesterId };
    window.scrollTo(0, 0); render();
  });
}

// ---- Backup (spec §5) ----
function runSemCreateBackup_() {
  state.semBackupBusy = true; render();
  runScript_('api_semCreateBackup', []).then(function (res) {
    state.semBackupBusy = false;
    if (!res.ok) { showToast_('error', 'Backup failed: ' + res.error); render(); return; }
    showToast_('success', 'Backup created: ' + res.data.backupId + '.');
    loadSemesterDashboard_();
  });
}
function runSemVerifyBackup_(backupId) {
  runScript_('api_semVerifyBackup', [backupId]).then(function (res) {
    if (!res.ok) { showToast_('error', 'Could not verify: ' + res.error); return; }
    showToast_(res.data.ok ? 'success' : 'error', res.data.ok ? ('Backup ' + backupId + ' verified OK.') : ('Backup ' + backupId + ' is missing: ' + res.data.missingSheets.join(', ')));
  });
}

// ---- Module Templates (spec §9) ----
function runSemSaveTemplates_() {
  state.semTemplatesBusy = true; render();
  runScript_('api_semSaveModuleTemplates', []).then(function (res) {
    state.semTemplatesBusy = false;
    if (!res.ok) { showToast_('error', 'Could not save templates: ' + res.error); render(); return; }
    showToast_('success', res.data.saved + ' module template(s) saved.');
    render();
  });
}

// ---- Finish Semester (spec §1) ----
function runSemMarkFinished_() {
  state.semFinishBusy = true; render();
  runScript_('api_semMarkFinished', []).then(function (res) {
    state.semFinishBusy = false;
    if (!res.ok) { showToast_('error', 'Could not mark finished: ' + res.error); render(); return; }
    showToast_('success', 'Semester marked finished.');
    loadSemesterDashboard_();
  });
}

// ---- Historical Analytics (spec §10) ----
function toggleSemCompare_() {
  state.semCompareView = !state.semCompareView;
  if (state.semCompareView && !state.semHistory) {
    runScript_('api_semHistoricalCompare', []).then(function (res) { state.semHistory = res.ok ? res.data : []; render(); });
  }
  render();
}

// ---- Delete Semester workflow (spec §6) ----
function openSemDeleteFlow_() {
  openConfirmModal('Delete this semester?',
    'This first generates the Semester Report, creates a Backup, and Archives the semester — all before anything is deleted. You will see a summary and must type "DELETE SEMESTER" before any active data is actually cleared. Continue?',
    'doSemStartDeleteWorkflow_', []);
}
function doSemStartDeleteWorkflow_() {
  state.semLoading = true; render();
  runScript_('api_semStartDeleteWorkflow', [state.semReflection]).then(function (res) {
    state.semLoading = false;
    if (!res.ok) { showToast_('error', 'Could not prepare the delete workflow: ' + res.error); render(); return; }
    state.semDeleteFlow = { stage: 'summary', summary: res.data.summary, semesterId: res.data.semesterId, backupId: res.data.backup.backupId, workflowToken: res.data.workflowToken };
    render();
  });
}
function toggleSemDeleteCalendarEvents_() { state.semDeleteCalendarEvents = !state.semDeleteCalendarEvents; render(); }
function cancelSemDeleteFlow_() { state.semDeleteFlow = null; render(); }
function openSemTypedDeleteModal_() {
  openTypedConfirmModal('Confirm deletion',
    'This clears Assignments, Assessments, Study Sessions, Revision, Marks, Attendance, Inbox and Automation history. Settings, Module Rules, Templates, and the Archive are kept.',
    'DELETE SEMESTER', 'doSemConfirmDelete_', []);
}
function doSemConfirmDelete_(typedPhrase) {
  runScript_('api_semConfirmDelete', [state.semDeleteFlow && state.semDeleteFlow.workflowToken, typedPhrase, { deleteCalendarEvents: state.semDeleteCalendarEvents }]).then(function (res) {
    if (!res.ok) { showToast_('error', 'Delete failed: ' + res.error); render(); return; }
    showToast_('success', 'Active semester data cleared. Use the New Semester Wizard to set up the next one.', 8000);
    state.semDeleteFlow = null; state.semData = null;
    loadSemesterDashboard_(); loadPlannerData();
  });
}

// ---- Reset Active Semester only (spec §7, independent of Delete Semester) ----
function openSemResetOnly_() {
  openTypedConfirmModal('Reset active semester data',
    'This is an emergency-only reset. The backend will automatically create and verify a fresh backup before clearing active data. It does not create a semester report or archive.',
    'EMERGENCY RESET', 'doSemResetOnly_', []);
}
function doSemResetOnly_(typedPhrase) {
  runScript_('api_semResetActiveSemester', [typedPhrase, { deleteCalendarEvents: state.semDeleteCalendarEvents }]).then(function (res) {
    if (!res.ok) { showToast_('error', 'Reset failed: ' + res.error); render(); return; }
    showToast_('success', 'Active semester data cleared.');
    state.semData = null;
    loadSemesterDashboard_(); loadPlannerData();
  });
}

// ---- New Semester Wizard (spec §8) ----
function openSemWizard_() {
  state.semLoading = true; render();
  runScript_('api_semWizardGetOptions', []).then(function (res) {
    state.semLoading = false;
    if (!res.ok) { showToast_('error', 'Could not open the Wizard: ' + res.error); render(); return; }
    state.semWizard = {
      step: 1, options: res.data, applying: false, error: '',
      config: {
        semesterName: '', academicYear: res.data.currentAcademicYear || '', startDate: '', endDate: '',
        modulesMode: 'reuse', reuseModuleCodes: [],
        coloursMode: 'preserve', colourOverrides: {},
        timetableMode: 'import',
        rulesMode: 'reuse',
        calendarMode: 'reuse', newCalendarName: ''
      }
    };
    render();
  });
}
function wizardSetField_(key, value) { if (!state.semWizard) return; state.semWizard.config[key] = value; render(); }
function wizardToggleModule_(code) {
  var cfg = state.semWizard.config;
  cfg.reuseModuleCodes = cfg.reuseModuleCodes || [];
  var i = cfg.reuseModuleCodes.indexOf(code);
  if (i === -1) cfg.reuseModuleCodes.push(code); else cfg.reuseModuleCodes.splice(i, 1);
  render();
}
function wizardSetColour_(code, hex) {
  var cfg = state.semWizard.config;
  cfg.colourOverrides = cfg.colourOverrides || {};
  cfg.colourOverrides[code] = hex;
  render();
}
function wizardNext_() {
  var w = state.semWizard;
  if (w.step === 1) {
    if (!(w.config.semesterName || '').trim()) { w.error = 'Enter a semester name.'; render(); return; }
    if (!w.config.startDate || !w.config.endDate) { w.error = 'Enter both a start and end date.'; render(); return; }
  }
  w.error = ''; w.step = Math.min(7, w.step + 1); render();
}
function wizardBack_() { state.semWizard.step = Math.max(1, state.semWizard.step - 1); render(); }
function closeSemWizard_() { state.semWizard = null; render(); }
function wizardApply_() {
  var w = state.semWizard;
  if (w.applying) return;
  w.applying = true; w.error = ''; render();
  runScript_('api_semWizardApply', [w.config]).then(function (res) {
    if (!res.ok) { w.applying = false; w.error = res.error; render(); return; }
    showToast_('success', 'New semester created: ' + res.data.semesterName + ' (' + res.data.semesterId + ').', 6000);
    state.semWizard = null; state.semData = null;
    loadSemesterDashboard_(); loadPlannerData();
  });
}
</script>
</body>
</html>
